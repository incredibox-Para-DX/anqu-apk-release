<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>手套预览</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:transparent;overflow:hidden}
#app{position:fixed;inset:0}
#status{display:none}
</style>
</head>
<body>
<div id="app"></div>
<div id="loading" style="position:fixed;inset:0;display:flex;align-items:center;justify-content:center;z-index:20;pointer-events:none;"><div style="width:36px;height:36px;border:3px solid rgba(255,255,255,.18);border-top-color:#8fd4ff;border-radius:50%;animation:__spin 1s linear infinite;"></div></div>
<style>@keyframes __spin{to{transform:rotate(360deg)}}</style>
<script type="module">
import * as THREE from './vendor/three/three.module.js';
import { GLTFLoader } from './vendor/three/addons/loaders/GLTFLoader.js';
import { RoomEnvironment } from './vendor/three/addons/environments/RoomEnvironment.js';

const P0 = new URLSearchParams(location.search);
const KIND = P0.get('gloves') || localStorage.getItem('ab_lion_gloves') || 'g05';
const SPECIAL = {
    kurt: ['gloves_kurt_quit', 'sniper'],
    snow: ['gloves_snow_retarget', 'snow'],
    xmas: ['gloves_xmas_uit', 'xmas'],
    rolf: ['gloves_rolf_uit', 'gloves']
};
const spec = KIND === 'g04' ? ['g04', 'g04'] : (SPECIAL[KIND] || [KIND, KIND]);
const NEED = [
    'lion/character.glb',
    'lion/bernard1.glb', 'lion/bernard2.glb', 'lion/bernard3.glb',
    'lion/' + spec[0] + '.glb',
    'lion/' + spec[1] + '_D.png', 'lion/' + spec[1] + '_N.png', 'lion/' + spec[1] + '_MAR.png',
    'lion/bernard_gloves_D.png', 'lion/bernard_gloves_N.png', 'lion/bernard_gloves_MAR.png',
    'lion/bernard_torso_D.png', 'lion/bernard_torso_N.png', 'lion/bernard_torso_MAR.png',
    'lion/bernard_leg_D.png', 'lion/bernard_leg_N.png', 'lion/bernard_leg_MAR.png',
    'lion/bernard_shoes_D.png', 'lion/bernard_shoes_N.png', 'lion/bernard_shoes_MAR.png'
];

const IDB_MAP = await (async function () {
    try {
        return await new Promise(function (resolve) {
            const map = {};
            const req = indexedDB.open('anqu_resources');
            req.onerror = function () { resolve(map); };
            req.onsuccess = function () {
                const db = req.result;
                try {
                    if (!db.objectStoreNames.contains('assets')) { resolve(map); return; }
                    const tx = db.transaction('assets', 'readonly');
                    const store = tx.objectStore('assets');
                    let pending = NEED.length;
                    if (!pending) { resolve(map); return; }
                    NEED.forEach(function (p) {
                        const g = store.get(p);
                        g.onsuccess = function () {
                            const r = g.result;
                            if (r && r.blob) { try { map[p] = URL.createObjectURL(r.blob); } catch (e) {} }
                            if (--pending === 0) resolve(map);
                        };
                        g.onerror = function () { if (--pending === 0) resolve(map); };
                    });
                } catch (e) { resolve(map); }
            };
        });
    } catch (e) { return {}; }
})();
THREE.DefaultLoadingManager.setURLModifier(function (url) {
    const n = url.indexOf('./') === 0 ? url.slice(2) : url;
    return IDB_MAP[n] || url;
});

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio || 1, 3));
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.setClearAlpha(0);
document.getElementById('app').appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = null;
const camera = new THREE.PerspectiveCamera(45, innerWidth / innerHeight, 0.01, 100);
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
scene.environmentIntensity = 0.75;
scene.add(new THREE.HemisphereLight(0xbfd4ff, 0x141a22, 1.8));
const key = new THREE.DirectionalLight(0xffffff, 2.2);
key.position.set(3, 5, 4);
scene.add(key);
const rim = new THREE.DirectionalLight(0x6ea8ff, 1.4);
rim.position.set(-3, 3, -3);
scene.add(rim);

const loader = new GLTFLoader();
let model = null;
let bernardGlove = null;
let bernardBaseGeo = null;
let originalSkel = null;
let originalBind = null;
let rolfSkel = null;
let bernardFullSkel = null;
let mixer = null;
let clips = [];
let current = 0;
const center = new THREE.Vector3();
let dist = 2.2;
let ang = 0.4;

function trimClip(clip) {
    const fps = 30;
    const start = Math.floor(0.3 * fps);
    const end = Math.max(start + 1, Math.floor((clip.duration - 0.5) * fps));
    return THREE.AnimationUtils.subclip(clip, clip.name, start, end, fps);
}

function play(i) {
    if (!mixer || !clips.length) return;
    current = ((i % clips.length) + clips.length) % clips.length;
    mixer.stopAllAction();
    const action = mixer.clipAction(clips[current]);
    action.setLoop(THREE.LoopOnce, 1);
    action.clampWhenFinished = true;
    action.reset();
    action.play();
}

function tex(path, srgb) {
    const t = new THREE.TextureLoader().load(path);
    t.flipY = false;
    if (srgb) t.colorSpace = THREE.SRGBColorSpace;
    return t;
}

function gloveMaterial(base) {
    return new THREE.MeshStandardMaterial({
        map: tex('./lion/' + base + '_D.png', true),
        normalMap: tex('./lion/' + base + '_N.png'),
        normalScale: new THREE.Vector2(1.25, 1.25),
        roughnessMap: tex('./lion/' + base + '_MAR.png'),
        metalnessMap: tex('./lion/' + base + '_MAR.png'),
        side: THREE.DoubleSide, roughness: 0.75, metalness: 0.05
    });
}

function setBernardGloveMaterial() {
    if (bernardGlove) bernardGlove.material = gloveMaterial('bernard_gloves');
}

function remapToFull(geo) {
    const si = geo.attributes.skinIndex, sw = geo.attributes.skinWeight;
    if (!si || !sw || !rolfSkel || !bernardFullSkel) return geo;
    const map = {};
    rolfSkel.bones.forEach(function (b, i) {
        const j = bernardFullSkel.bones.findIndex(function (x) { return x.name === b.name; });
        map[i] = j >= 0 ? j : 0;
    });
    const n = si.count, out = new Uint16Array(n * 4);
    for (let v = 0; v < n; v++) {
        for (let k = 0; k < 4; k++) out[v * 4 + k] = map[si.getComponent(v, k)] || 0;
    }
    const g = geo.clone();
    g.setAttribute('skinIndex', new THREE.Uint16BufferAttribute(out, 4));
    return g;
}

function mountGlove() {
    if (!bernardGlove) return;
    if (KIND === 'g04') {
        bernardGlove.geometry = bernardBaseGeo;
        if (originalSkel) bernardGlove.bind(originalSkel, originalBind);
        bernardGlove.material = gloveMaterial('g04');
        bernardGlove.visible = true;
        return;
    }
    bernardGlove.visible = true;
    loader.load('./lion/' + spec[0] + '.glb', function (gltf) {
        let mesh = null;
        gltf.scene.traverse(function (o) { if (!mesh && o.isMesh) mesh = o; });
        if (!mesh) return;
        let geo = mesh.geometry;
        if (/^g\d\d$/.test(KIND)) geo = remap164(geo);
        geo = remapToFull(geo);
        bernardGlove.geometry = geo;
        if (bernardFullSkel) bernardGlove.bind(bernardFullSkel, originalBind || bernardGlove.bindMatrix);
        bernardGlove.material = gloveMaterial(spec[1]);
        bernardGlove.visible = true;
    }, undefined, function (e) { console.error(e); });
}

function loadGLB(p) {
    return new Promise(function (resolve, reject) {
        loader.load(p, resolve, undefined, reject);
    });
}

Promise.all([
    loadGLB('./lion/character.glb'),
    loadGLB('./lion/bernard1.glb'),
    loadGLB('./lion/bernard2.glb'),
    loadGLB('./lion/bernard3.glb')
]).then(function (list) {
    list[0].scene.traverse(function (o) {
        if (o.isMesh && /glove/i.test(o.name || '') && !rolfSkel) rolfSkel = o.skeleton;
    });
    model = list[1].scene;
    model.scale.setScalar(0.01);
    model.rotation.y = Math.PI;
    model.traverse(function (o) {
        if (!o.isMesh) return;
        o.frustumCulled = false;
        const n = (o.name || '').toLowerCase();
        if (n.indexOf('glove') >= 0) {
            if (!bernardGlove) {
                bernardGlove = o;
                bernardBaseGeo = o.geometry;
                originalSkel = o.skeleton;
                originalBind = o.bindMatrix.clone();
            }
            o.visible = true;
            o.material = gloveMaterial('bernard_gloves');
        } else if (n.indexOf('torso') >= 0) {
            o.visible = true;
            o.material = new THREE.MeshStandardMaterial({ map: tex('./lion/bernard_torso_D.png', true), normalMap: tex('./lion/bernard_torso_N.png'), roughnessMap: tex('./lion/bernard_torso_MAR.png'), metalnessMap: tex('./lion/bernard_torso_MAR.png'), side: THREE.DoubleSide, roughness: 0.8, metalness: 0.05 });
        } else if (n.indexOf('leg') >= 0) {
            o.visible = true;
            o.material = new THREE.MeshStandardMaterial({ map: tex('./lion/bernard_leg_D.png', true), normalMap: tex('./lion/bernard_leg_N.png'), roughnessMap: tex('./lion/bernard_leg_MAR.png'), metalnessMap: tex('./lion/bernard_leg_MAR.png'), side: THREE.DoubleSide, roughness: 0.8, metalness: 0.05 });
        } else if (n.indexOf('shoe') >= 0) {
            o.visible = true;
            o.material = new THREE.MeshStandardMaterial({ map: tex('./lion/bernard_shoes_D.png', true), normalMap: tex('./lion/bernard_shoes_N.png'), roughnessMap: tex('./lion/bernard_shoes_MAR.png'), metalnessMap: tex('./lion/bernard_shoes_MAR.png'), side: THREE.DoubleSide, roughness: 0.8, metalness: 0.05 });
        } else {
            o.visible = false;
        }
    });
    const bones = [];
    model.traverse(function (o) { if (o.isBone) bones.push(o); });
    bernardFullSkel = new THREE.Skeleton(bones);
    scene.add(model);
    model.updateMatrixWorld(true);

    const box = new THREE.Box3().setFromObject(model);
    if (!box.isEmpty()) {
        box.getCenter(center);
        const size = box.getSize(new THREE.Vector3());
        center.y += size.y * 0.1;
        dist = Math.max(size.y * 1.15, size.x * 2.0, 1.6);
    }

    clips = list.slice(1).map(function (g) { return g.animations && g.animations[0]; })
        .filter(Boolean).map(trimClip);
    if (clips.length) {
        mixer = new THREE.AnimationMixer(model);
        mixer.addEventListener('finished', function () { play(current + 1); });
    }

    mountGlove();
    play(0);
    const l = document.getElementById('loading');
    if (l) l.style.display = 'none';
    try { parent.postMessage('inspect-ready', '*'); } catch (e) {}
}).catch(function (e) {
    console.error(e);
    const l = document.getElementById('loading');
    if (l) l.style.display = 'none';
    try { parent.postMessage('inspect-ready', '*'); } catch (e) {}
});

addEventListener('message', function (e) {
    if (typeof e.data === 'string' && e.data.indexOf('gloves:') === 0) {
        location.href = 'glove-preview.html?gloves=' + encodeURIComponent(e.data.slice(7)) + '&t=' + Date.now();
    }
});

addEventListener('resize', function () {
    camera.aspect = innerWidth / innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(innerWidth, innerHeight);
});

const clock = new THREE.Clock();
function animate() {
    requestAnimationFrame(animate);
    const dt = Math.min(clock.getDelta(), 0.05);
    if (mixer) mixer.update(dt);
    ang += dt * 0.25;
    camera.position.set(
        center.x + Math.sin(ang) * dist,
        center.y + dist * 0.12,
        center.z + Math.cos(ang) * dist
    );
    camera.lookAt(center);
    renderer.render(scene, camera);
}
animate();
</script>
</body>
</html>
