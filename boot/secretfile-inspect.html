    const fps = 30;
    const start = Math.floor(0.3 * fps);

    const trimmed = THREE.AnimationUtils.subclip(clip, clip.name, start, end, fps);

      const box = new THREE.Box3().setFromObject(prop);
      const center = box.getCenter(new THREE.Vector3());

  if (!window.__snowGeoBackup) window.__snowGeoBackup = mesh.geometry;
  if (!window.__snowMatBackup) window.__snowMatBackup = mesh.material;
  if (/^g\d\d$/.test(kind)) {
    var applyG = function (geo) {
      if (!geo) return;
      mesh.geometry = geo;
      var gm = new THREE.MeshStandardMaterial({ side: THREE.DoubleSide, roughness: 0.75, metalness: 0.05 });
      gm.map = loadColor(ASSET + 'lion/' + kind + '_D.png');
      gm.normalMap = loadData(ASSET + 'lion/' + kind + '_N.png');
      gm.normalScale = new THREE.Vector2(2.0, 2.0);
      gm.roughnessMap = loadData(ASSET + 'lion/' + kind + '_MAR.png');
      gm.metalnessMap = gm.roughnessMap;
      mesh.material = gm;
    };
    if (gloveCacheG[kind]) { applyG(gloveCacheG[kind]); return; }
    loader.load(ASSET + 'lion/' + kind + '.glb', function (gltf) {
      var geo = null;
      gltf.scene.traverse(function (o) { if (o.isMesh && !geo) geo = o.geometry; });
      if (!geo) return;
      geo = remap87(geo);
      gloveCacheG[kind] = geo;
      applyG(geo);
    }, undefined, function (e) { console.error(e); });
    return;
  }
  if (kind === 'rolf' && window.__rolfGeo) {
    mesh.geometry = window.__rolfGeo;
    mesh.material = new THREE.MeshStandardMaterial({ map: texGlove, normalMap: texGloveN, normalScale: new THREE.Vector2(2.0, 2.0), side: THREE.DoubleSide, roughness: 0.75, metalness: 0.05 });
  } else if (kind === 'kurt' && window.__kurtGeo) {
    mesh.geometry = window.__kurtGeo;
    mesh.material = new THREE.MeshStandardMaterial({ map: texKurt, normalMap: texKurtN, normalScale: new THREE.Vector2(2.0, 2.0), roughnessMap: texKurtMAR, metalnessMap: texKurtMAR, side: THREE.DoubleSide, roughness: 0.78, metalness: 0.05, envMapIntensity: 0.6 });
  } else if (kind === 'xmas' && window.__xmasGeo) {
    mesh.geometry = window.__xmasGeo;
    mesh.material = new THREE.MeshStandardMaterial({ map: texXmas, normalMap: texXmasN, normalScale: new THREE.Vector2(2.0, 2.0), roughnessMap: texXmasMAR, metalnessMap: texXmasMAR, side: THREE.DoubleSide, roughness: 1, metalness: 1, envMapIntensity: 1.2 });
  } else {
    mesh.geometry = window.__snowGeoBackup;
    mesh.material = window.__snowMatBackup;
  }
}

loader.load(ASSET + 'lion/secretfile_character.glb', setupCharacter, undefined, function (e) {
  document.getElementById('status').textContent = 'role fail';
  console.error(e);
});
loader.parse(b64ToBuf(SECRET_B64), '', setupProp, function (e) {
  document.getElementById('status').textContent += ' prop=fail';
  console.error(e);
});

document.addEventListener('click', function () { try { parent.closeLionInspect(); } catch (e) {} });

var __lastReplay = 0;
function replayAnim() {
  var now = Date.now();
  if (now - __lastReplay < 1200) return;
  __lastReplay = now;
  if (!actions.length) { setTimeout(replayAnim, 120); return; }
  mixers.forEach(function (m) { try { m.time = 0; } catch (e) {} });
  actions.forEach(function (a) { try { a.stop(); a.reset(); a.play(); } catch (err) {} });
  mixers.forEach(function (m) { try { m.update(0); } catch (e) {} });
}

window.addEventListener('message', function (e) {
  if (e.data === 'lion-replay') { replayAnim(); return; }
  if (typeof e.data === 'string' && e.data.indexOf('gloves:') === 0) {
    applyGloves(e.data.slice(7));
  }
});

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

const IS_PRELOAD = new URLSearchParams(location.search).get('preload') === '1';
const clock = new THREE.Clock();
function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);
  mixers.forEach(function (m) { m.update(dt); });
  if (window.__head) {
    window.__head.getWorldPosition(tmp);
    camera.position.copy(tmp);
    camera.position.y += 0.1;
    if (window.__socket) {
      window.__socket.getWorldPosition(camera.__target || (camera.__target = new THREE.Vector3()));
      const target = camera.__target;
      camera.lookAt(target);
    }
  }
  renderer.render(scene, camera);
  if (IS_PRELOAD && clock.elapsedTime > 2) return;
}
animate();
</script>
