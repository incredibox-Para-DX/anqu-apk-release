  model.scale.setScalar(0.01);
  model.traverse(function (o) {
    if (!o.isMesh) return;
    o.frustumCulled = false;
    const nm = (o.name || '').toLowerCase();
    if (nm.indexOf('glove') >= 0) {
      o.material = new THREE.MeshStandardMaterial({ map: texSnow, normalMap: texSnowN, normalScale: new THREE.Vector2(1.25, 1.25), roughnessMap: texSnowMAR, metalnessMap: texSnowMAR, side: THREE.DoubleSide, roughness: 0.7, metalness: 0.1, envMapIntensity: 0.5 });
    } else if (nm.indexOf('leg') >= 0) {
      o.material = new THREE.MeshStandardMaterial({ map: texLeg, normalMap: texLegN, normalScale: new THREE.Vector2(1.25, 1.25), side: THREE.DoubleSide, roughness: 0.8, metalness: 0.05 });
    } else if (nm.indexOf('shoe') >= 0) {
      o.material = new THREE.MeshStandardMaterial({ map: texShoe, side: THREE.DoubleSide, roughness: 0.8, metalness: 0.05 });
    } else if (nm.indexOf('head') >= 0) {
      o.material = new THREE.MeshStandardMaterial({ map: texHead, normalMap: texHeadN, normalScale: new THREE.Vector2(1.25, 1.25), side: THREE.DoubleSide, roughness: 0.75, metalness: 0.05 });
      o.visible = false;
    } else if (nm.indexOf('torso') >= 0) {
      o.material = new THREE.MeshStandardMaterial({ map: texTorso, normalMap: texTorsoN, normalScale: new THREE.Vector2(1.25, 1.25), side: THREE.DoubleSide, roughness: 0.8, metalness: 0.05 });
    }
  });
  scene.add(model);
  model.updateMatrixWorld(true);
  window.__model = model;
  window.__fpMode = false;
  window.__head = model.getObjectByName('head') || model.getObjectByName('neck_01') || model.getObjectByName('camera_animated');
  window.__socket = model.getObjectByName('item_r') || model.getObjectByName('hand_r');
  window.__gloveMeshes = [];
  model.traverse(function (o) {
    if (o.isMesh && (o.name || '').toLowerCase().indexOf('glove') >= 0) { window.__gloveMeshes.push(o); o.visible = false; }
  });

  gltf.animations.forEach(function (clip) {
    const fps = 30;
    const start = Math.floor(0.3 * fps);
    const end = Math.max(start + 1, Math.floor((clip.duration - 0.5) * fps));
    const trimmed = THREE.AnimationUtils.subclip(clip, clip.name, start, end, fps);
    const mixer = new THREE.AnimationMixer(model);
    const action = mixer.clipAction(trimmed);
    action.setLoop(THREE.LoopOnce, 1);
    action.clampWhenFinished = true;
    action.play();
    if (clip.name.indexOf('.002') < 0) {
      mixer.addEventListener('finished', function () {
        try { parent.closeLionInspect(); } catch (e) {}
      });
    }
    mixers.push(mixer);
  });
  document.getElementById('status').textContent = 'anim=' + gltf.animations.length + ' socket=' + (window.__socket ? window.__socket.name : 'none');
  applyGloves();
  try { parent.postMessage('inspect-ready', '*'); } catch (e) {}
  var _l = document.getElementById('loading'); if (_l) _l.style.display = 'none';
  try { var _a = new Audio('./lion/inspect_xcompound.wav'); _a.volume = (window.parent && window.parent.__UI_SOUND_VOLUME__ != null ? window.parent.__UI_SOUND_VOLUME__ : 1); _a.currentTime = 0.3; _a.play().catch(function () {}); window.__inspectAudio = _a; } catch (e) {}
}

function remapGloveSkin(geo, map) {
  var si = geo.attributes.skinIndex, sw = geo.attributes.skinWeight;
  if (!si || !sw) return geo;
  var n = si.count, out = new Uint16Array(n * 4);
  for (var v = 0; v < n; v++) {
    for (var k = 0; k < 4; k++) {
      var idx = si.getComponent(v, k);
      var w = sw.getComponent(v, k);
      var m = (w > 0 && idx < map.length) ? map[idx] : 0;
      out[v * 4 + k] = m >= 0 ? m : 0;
    }
  }
  var g = geo.clone();
  g.setAttribute('skinIndex', new THREE.Uint16BufferAttribute(out, 4));
  return g;
}
function gloveMaterial(kind) {
  if (/^g\d\d$/.test(kind)) {
    var gm = new THREE.MeshStandardMaterial({ side: THREE.DoubleSide, roughness: 0.5, metalness: 0.0, envMapIntensity: 1.0 });
    gm.map = loadColor(ASSET + 'lion/' + kind + '_D.png');
    gm.normalMap = loadData(ASSET + 'lion/' + kind + '_N.png');
    gm.normalScale = new THREE.Vector2(1.25, 1.25);
    gm.roughnessMap = loadData(ASSET + 'lion/' + kind + '_MAR.png');
    gm.metalnessMap = gm.roughnessMap;
    return gm;
  }
  if (kind === 'rolf') return new THREE.MeshStandardMaterial({ map: texGlove, normalMap: texGloveN, normalScale: new THREE.Vector2(1.25, 1.25), side: THREE.DoubleSide, roughness: 0.75, metalness: 0.05 });
  if (kind === 'kurt') return new THREE.MeshStandardMaterial({ map: texKurt, normalMap: texKurtN, normalScale: new THREE.Vector2(2.0, 2.0), roughnessMap: texKurtMAR, metalnessMap: texKurtMAR, side: THREE.DoubleSide, roughness: 0.78, metalness: 0.05, envMapIntensity: 0.6 });
  if (kind === 'xmas') return new THREE.MeshStandardMaterial({ map: texXmas, normalMap: texXmasN, normalScale: new THREE.Vector2(1.25, 1.25), roughnessMap: texXmasMAR, metalnessMap: texXmasMAR, side: THREE.DoubleSide, roughness: 1, metalness: 1, envMapIntensity: 1.2 });
  return new THREE.MeshStandardMaterial({ map: texSnow, normalMap: texSnowN, normalScale: new THREE.Vector2(1.25, 1.25), roughnessMap: texSnowMAR, metalnessMap: texSnowMAR, side: THREE.DoubleSide, roughness: 0.7, metalness: 0.1, envMapIntensity: 0.5 });
}
function applyGloves(kindOverride) {
  var kind = kindOverride || new URLSearchParams(location.search).get('gloves') || localStorage.getItem('ab_lion_gloves') || 'g05';
  var mesh = (window.__gloveMeshes || [])[0];
  if (!mesh) return;
  if (!window.__gloveGeoBackup) window.__gloveGeoBackup = mesh.geometry;
  if (!window.__gloveMatBackup) window.__gloveMatBackup = mesh.material;
  if (!GLOVE_URLS[kind]) kind = 'rolf';
  if (gloveGeo[kind]) {
    mesh.geometry = gloveGeo[kind];
    mesh.material = gloveMaterial(kind);
    mesh.visible = true;
    return;
  }
  loader.load(ASSET + GLOVE_URLS[kind], function (gltf) {
    var geo = null, gname = '';
    gltf.scene.traverse(function (o) { if (o.isMesh && !geo) { geo = o.geometry; gname = o.name || ''; } });
    if (!geo) {
      mesh.geometry = window.__gloveGeoBackup;
      mesh.material = window.__gloveMatBackup;
      mesh.visible = true;
      var st0 = document.getElementById('status');
      if (st0) st0.textContent = 'glove empty: ' + kind;
      return;
    }
    geo = GLOVE_MAPS[kind] ? remapGloveSkin(geo, GLOVE_MAPS[kind]) : geo;
    gloveGeo[kind] = geo;
    mesh.geometry = geo;
    mesh.material = gloveMaterial(kind);
    mesh.visible = true;
    var st = document.getElementById('status');
    if (st) st.textContent = 'glove=' + kind + ' ' + gname + ' verts=' + geo.attributes.position.count + ' skin=' + (!!geo.attributes.skinIndex);
  }, undefined, function (e) {
    mesh.geometry = window.__gloveGeoBackup;
    mesh.material = window.__gloveMatBackup;
    mesh.visible = true;
    var st2 = document.getElementById('status');
    if (st2) st2.textContent = 'glove fail: ' + kind;
    console.error(e);
  });
}

function setupProp(gltf) {
  const prop = gltf.scene;
  prop.traverse(function (o) {
    if (!o.isMesh) return;
    if (!o.geometry.attributes.normal) o.geometry.computeVertexNormals();
    var __glass = (o.material && (o.material.name || '').indexOf('Glass') >= 0);
      o.material = new THREE.MeshStandardMaterial({ map: texFile, normalMap: texFileN, roughnessMap: texFileMA, metalnessMap: texFileMA, side: THREE.DoubleSide, roughness: __glass ? 0.12 : 0.75, metalness: __glass ? 0.0 : 0.05, transparent: __glass, opacity: __glass ? 0.25 : 1.0, depthWrite: !__glass, envMapIntensity: __glass ? 1.0 : 0.25 });
      if (__glass) o.renderOrder = 1;
  });
  window.__prop = prop;
  const attach = function () {
    if (window.__socket) {
      prop.scale.setScalar(1.0);
      prop.rotation.set(Math.PI / 2, 0, 0);
      prop.updateMatrixWorld(true);
      const box = new THREE.Box3().setFromObject(prop);
      const center = box.getCenter(new THREE.Vector3());
      window.__socket.add(prop);
      prop.position.set(-center.x - 16, -center.y, -center.z - 2);
      document.getElementById('status').textContent = 'attached to ' + window.__socket.name;
    } else {
      setTimeout(attach, 100);
    }
  };
  attach();
  document.getElementById('status').textContent += ' prop=ok';
}

var __lastReplay = 0;
function replayAnim() {
  var now = Date.now();
  if (now - __lastReplay < 1200) return;
  __lastReplay = now;
  if (!actions.length) { setTimeout(replayAnim, 120); return; }
  mixers.forEach(function (m) { try { m.time = 0; } catch (e) {} });
  actions.forEach(function (a) { try { a.stop(); a.reset(); a.play(); } catch (err) {} });
  mixers.forEach(function (m) { try { m.update(0); } catch (e) {} });
}

window.addEventListener('message', function (e) {
  if (e.data === 'lion-replay') { replayAnim(); return; }
  if (typeof e.data === 'string' && e.data.indexOf('gloves:') === 0) {
    applyGloves(e.data.slice(7));
  }
});
