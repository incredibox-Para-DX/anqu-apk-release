function b64ToBuf(b64) {
  const s = atob(b64);
  const a = new Uint8Array(s.length);
  for (let i = 0; i < s.length; i++) a[i] = s.charCodeAt(i);
  return a.buffer;
}
const tmp = new THREE.Vector3();
let mixers = [];

function setupCharacter(gltf) {
  const model = gltf.scene;
  model.scale.setScalar(0.01);
  model.traverse(function (o) {
    if (!o.isMesh) return;
    o.frustumCulled = false;
    const nm = (o.name || '').toLowerCase();
    if (nm.indexOf('glove') >= 0) {
      o.material = new THREE.MeshStandardMaterial({ map: texSnow, normalMap: texSnowN, roughnessMap: texSnowMAR, metalnessMap: texSnowMAR, side: THREE.DoubleSide, roughness: 0.7, metalness: 0.1, envMapIntensity: 0.5 });
    } else if (nm.indexOf('leg') >= 0) {
      o.material = new THREE.MeshStandardMaterial({ map: texLeg, normalMap: texLegN, side: THREE.DoubleSide, roughness: 0.8, metalness: 0.05 });
    } else if (nm.indexOf('shoe') >= 0) {
      o.material = new THREE.MeshStandardMaterial({ map: texShoe, side: THREE.DoubleSide, roughness: 0.8, metalness: 0.05 });
    } else if (nm.indexOf('head') >= 0) {
      o.material = new THREE.MeshStandardMaterial({ map: texHead, normalMap: texHeadN, side: THREE.DoubleSide, roughness: 0.75, metalness: 0.05 });
      o.visible = false;
    } else if (nm.indexOf('torso') >= 0) {
      o.material = new THREE.MeshStandardMaterial({ map: texTorso, normalMap: texTorsoN, side: THREE.DoubleSide, roughness: 0.8, metalness: 0.05 });
    }
  });
  scene.add(model);
  model.updateMatrixWorld(true);
  window.__model = model;
  window.__head = model.getObjectByName('head') || model.getObjectByName('neck_01');
  window.__socket = model.getObjectByName('item_r') || model.getObjectByName('hand_r');
  window.__gloveMeshes = [];
  model.traverse(function (o) {
    if (o.isMesh && (o.name || '').toLowerCase().indexOf('glove') >= 0) window.__gloveMeshes.push(o);
  });

  gltf.animations.forEach(function (clip) {
    const fps = 30;
    const start = Math.floor(0.3 * fps);
    const end = Math.max(start + 1, Math.floor((clip.duration - 0.5) * fps));
    const trimmed = THREE.AnimationUtils.subclip(clip, clip.name, start, end, fps);
    const mixer = new THREE.AnimationMixer(model);
    const action = mixer.clipAction(trimmed);
    action.setLoop(THREE.LoopOnce, 1);
    action.clampWhenFinished = true;
    action.play();
    if (clip.name.indexOf('.002') < 0) {
      mixer.addEventListener('finished', function () {
        try { parent.closeLionInspect(); } catch (e) {}
      });
    }
    mixers.push(mixer);
  });
  applyGloves();
  document.getElementById('status').textContent = 'anim=' + gltf.animations.length + ' socket=' + (window.__socket ? window.__socket.name : 'none');
}

function setupProp(gltf) {
  const prop = gltf.scene;
  prop.traverse(function (o) {
    if (!o.isMesh) return;
    if (!o.geometry.attributes.normal) o.geometry.computeVertexNormals();
    o.material = new THREE.MeshStandardMaterial({ map: texFile, normalMap: texFileN, side: THREE.DoubleSide, roughness: 0.7, metalness: 0.0, transparent: true, alphaTest: 0.1 });
  });
  window.__prop = prop;
  const attach = function () {
    if (window.__socket) {
      window.__socket.add(prop);
      prop.scale.setScalar(0.77);
      prop.updateMatrixWorld(true);
      const box = new THREE.Box3().setFromObject(prop);
      const center = box.getCenter(new THREE.Vector3());
      prop.position.set(-center.x - 0.17, -center.y - 0.15, -center.z + 0.08);
      prop.rotation.set(0, 0, 0);
      document.getElementById('status').textContent = 'attached to ' + window.__socket.name;
    } else {
      setTimeout(attach, 100);
    }
  };
  attach();
  document.getElementById('status').textContent += ' prop=ok';
}

loader.load(ASSET + 'lion/gloves_rolf_uit.glb', function (gltf) {
  gltf.scene.traverse(function (o) { if (o.isMesh && !window.__rolfGeo) window.__rolfGeo = o.geometry; });
  applyGloves();
}, undefined, function (e) { console.error(e); });
loader.load(ASSET + 'lion/gloves_xmas_uit.glb', function (gltf) {
  gltf.scene.traverse(function (o) { if (o.isMesh && !window.__xmasGeo) window.__xmasGeo = o.geometry; });
  applyGloves();
}, undefined, function (e) { console.error(e); });

function applyGloves(kindOverride) {
  var kind = kindOverride || new URLSearchParams(location.search).get('gloves') || localStorage.getItem('ab_lion_gloves') || 'rolf';
  var mesh = (window.__gloveMeshes || [])[0];
  var dbg = document.getElementById('status');
  if (dbg) dbg.textContent = 'gloves=' + (window.__gloveMeshes || []).length + ' rolfGeo=' + !!window.__rolfGeo + ' xmasGeo=' + !!window.__xmasGeo + ' kind=' + kind;
  if (!mesh) return;
  if (!window.__snowGeoBackup) window.__snowGeoBackup = mesh.geometry;
  if (!window.__snowMatBackup) window.__snowMatBackup = mesh.material;
  if (kind === 'rolf' && window.__rolfGeo) {
    mesh.geometry = window.__rolfGeo;
    mesh.material = new THREE.MeshStandardMaterial({ map: texGlove, normalMap: texGloveN, side: THREE.DoubleSide, roughness: 0.75, metalness: 0.05 });
  } else if (kind === 'xmas' && window.__xmasGeo) {
    mesh.geometry = window.__xmasGeo;
    mesh.material = new THREE.MeshStandardMaterial({ map: texXmas, normalMap: texXmasN, roughnessMap: texXmasMAR, metalnessMap: texXmasMAR, side: THREE.DoubleSide, roughness: 1, metalness: 1, envMapIntensity: 1.2 });
  } else {
    mesh.geometry = window.__snowGeoBackup;
    mesh.material = window.__snowMatBackup;
  }
}

loader.load(ASSET + 'lion/kurt_character.glb', setupCharacter, undefined, function (e) {
  document.getElementById('status').textContent = 'role fail';
  console.error(e);
});
loader.parse(b64ToBuf(SECRET_B64), '', setupProp, function (e) {
  document.getElementById('status').textContent += ' prop=fail';
  console.error(e);
});

document.addEventListener('click', function () { try { parent.closeLionInspect(); } catch (e) {} });

var __lastReplay = 0;
function replayAnim() {
  var now = Date.now();
  if (now - __lastReplay < 1200) return;
  __lastReplay = now;
  if (!actions.length) { setTimeout(replayAnim, 120); return; }
  mixers.forEach(function (m) { try { m.time = 0; } catch (e) {} });
  actions.forEach(function (a) { try { a.stop(); a.reset(); a.play(); } catch (err) {} });
  mixers.forEach(function (m) { try { m.update(0); } catch (e) {} });
}

window.addEventListener('message', function (e) {
  if (e.data === 'lion-replay') { replayAnim(); return; }
  if (typeof e.data === 'string' && e.data.indexOf('gloves:') === 0) {
    applyGloves(e.data.slice(7));
  }
});

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

const IS_PRELOAD = new URLSearchParams(location.search).get('preload') === '1';
const clock = new THREE.Clock();
function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);
  mixers.forEach(function (m) { m.update(dt); });
  if (window.__head) {
    window.__head.getWorldPosition(tmp);
    camera.position.copy(tmp);
    camera.position.y += 0.1;
    if (window.__socket) {
      window.__socket.getWorldPosition(camera.__target || (camera.__target = new THREE.Vector3()));
      const target = camera.__target;
      camera.lookAt(target);
    }
  }
  renderer.render(scene, camera);
  if (IS_PRELOAD && clock.elapsedTime > 2) return;
}
animate();
