<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="anqu-shell" content="1">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>暗区保险模拟</title>
<link rel="stylesheet" href="css/shell.css">
<style>
@font-face {
    font-family: 'ABShell';
    src: url('fonts/Arena Breakout.ttf') format('truetype');
    font-display: swap;
}
body, button { font-family: 'ABShell', 'Microsoft YaHei', sans-serif; }
.dl-status, .dl-status *, #dl-msg, #dl-pct, #dl-pct-sign {
    font-family: 'ABShell', 'Microsoft YaHei', sans-serif !important;
}
#route-btn {
    position: fixed;
    top: calc(14px + env(safe-area-inset-top));
    right: 14px;
    z-index: 10001;
    display: none;
    padding: 7px 14px;
    border-radius: 14px;
    border: 1px solid rgba(255, 255, 255, .28);
    background: linear-gradient(145deg, rgba(255,255,255,.18), rgba(255,255,255,.05));
    -webkit-backdrop-filter: blur(14px) saturate(160%);
    backdrop-filter: blur(14px) saturate(160%);
    color: #f1f5f9;
    font-size: 13px;
    box-shadow: inset 0 1px 0 rgba(255,255,255,.35), 0 6px 18px rgba(0,0,0,.35);
}
#route-panel {
    display: none;
    position: fixed;
    inset: 0;
    z-index: 10002;
    padding: calc(18px + env(safe-area-inset-top)) 14px 22px;
    overflow: auto;
    color: #eef2f7;
    background: linear-gradient(160deg, rgba(18,20,26,.55), rgba(10,12,16,.72));
    -webkit-backdrop-filter: blur(22px) saturate(140%);
    backdrop-filter: blur(22px) saturate(140%);
}
.route-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    padding: 11px 13px;
    border-radius: 16px;
    border: 1px solid rgba(255, 255, 255, .22);
    background: linear-gradient(145deg, rgba(255,255,255,.16), rgba(255,255,255,.05));
    box-shadow: inset 0 1px 0 rgba(255,255,255,.28), 0 6px 16px rgba(0,0,0,.25);
}
.route-name { font-size: 13px; color: #f8fafc; }
.route-speed { font-size: 12px; min-width: 74px; text-align: right; color: #94a3b8; }
.route-sel {
    padding: 6px 12px;
    border-radius: 12px;
    border: 1px solid rgba(147, 197, 253, .55);
    background: linear-gradient(145deg, rgba(59,130,246,.35), rgba(59,130,246,.12));
    color: #dbeafe;
    font-size: 12px;
}
</style>
</head>
<body>
<video id="video-intro" src="backgrounds/Login/LoginCG.mp4" autoplay playsinline webkit-playsinline x5-playsinline x-webkit-airplay="allow" poster="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNk+M9QDwADhgGAWjR9awAAAABJRU5ErkJggg==" preload="auto"></video>
<video id="video-main" src="backgrounds/Login/CG.mp4" playsinline webkit-playsinline x5-playsinline x-webkit-airplay="allow" poster="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNk+M9QDwADhgGAWjR9awAAAABJRU5ErkJggg==" preload="auto" loop></video>
<div class="dl-status" id="dl-status">
<div class="dl-title">暗区保险模拟</div>
<div class="dl-line"><span id="dl-pct">0</span><span id="dl-pct-sign">%</span></div>
<div class="dl-line dl-bytes"><span id="dl-msg">正在下载资源中…</span></div>
</div>
<div class="dl-bar" id="dl-bar"><div class="dl-bar-fill" id="dl-fill"></div></div>
<button id="route-btn">线路</button>
<div id="route-panel">
<div style="display:flex;justify-content:space-between;align-items:center;">
<div style="font-size:17px;font-weight:700;">选择下载线路</div>
<button id="route-close" style="background:transparent;border:0;color:#94a3b8;font-size:22px;">&times;</button>
</div>
<div id="route-list" style="margin-top:12px;display:flex;flex-direction:column;gap:10px;"></div>
<button id="route-rescan" style="margin-top:14px;width:100%;padding:11px;border-radius:14px;border:1px solid rgba(255,255,255,.22);background:rgba(255,255,255,.07);color:#e2e8f0;font-size:13px;">重新测速</button>
</div>

<div id="download-mode-modal" style="display:none;position:fixed;inset:0;z-index:2147483647;background:rgba(0,0,0,.45);align-items:center;justify-content:center;">
<div style="width:min(440px,88vw);background:linear-gradient(160deg,rgba(18,20,26,.92),rgba(10,12,16,.96));border:1px solid rgba(255,255,255,.18);border-radius:16px;padding:20px;color:#eef2f7;">
<div style="font-size:18px;font-weight:700;">精简下载</div>
<div style="font-size:12px;color:#94a3b8;line-height:1.6;margin-top:10px;display:none;">完整下载：下载必要代码和全部资源（3D 模型、贴图、动画、背景、音乐、段位/收藏/名片资源），可离线使用全部功能和检视。</div>
<div style="font-size:12px;color:#94a3b8;line-height:1.6;margin-top:6px;">精简下载：只下载必要代码，先进入游戏；模型、背景、音乐等资源按需加载或稍后再下。</div>
<div style="font-size:12px;color:#f59e0b;line-height:1.6;margin-top:8px;">未完整下载时部分功能会受影响，但可以在游戏内「资源下载」功能补下。</div>
<div style="display:flex;gap:10px;margin-top:18px;">
<button id="download-mode-full" style="display:none;flex:1;padding:11px;border-radius:12px;border:0;background:linear-gradient(145deg,rgba(59,130,246,.85),rgba(37,99,235,.75));color:#fff;font-size:14px;font-weight:600;">完整下载</button>
<button id="download-mode-lite" style="flex:1;padding:11px;border-radius:12px;border:1px solid rgba(255,255,255,.24);background:rgba(255,255,255,.06);color:#e2e8f0;font-size:14px;">精简下载</button>
</div>
</div>
</div>
<script>
(function(){
  var KEY='ab_download_mode', INSTALL_ID='377';
  try { localStorage.setItem(KEY,'lite'); } catch(e) {}
  var saved=null;
  try { saved=localStorage.getItem('ab_install_id'); } catch(e) {}
  var force = saved !== INSTALL_ID;
  if (force) { try { localStorage.setItem('ab_install_id',INSTALL_ID); } catch(e) {} }
  function loadScripts(){
    window.__forceRedownload = !!force;
    var a=document.createElement('script');
    a.src='js/boot-download.js';
    a.onload=function(){
      var b=document.createElement('script');
      b.src='js/shell.js';
      document.body.appendChild(b);
    };
    document.body.appendChild(a);
  }
  function start(){
    var saved=null, readyInstall=null;
    try { saved=localStorage.getItem('ab_install_id'); readyInstall=localStorage.getItem('ab_boot_ready_install'); } catch(e) {}
    if (saved === INSTALL_ID && readyInstall === INSTALL_ID) {
      location.replace('index.html?r=' + Date.now());
      return;
    }
    loadScripts();
  }
  var v=document.getElementById('video-intro');
  if(!v){ start(); return; }
  v.addEventListener('ended', start);
  v.addEventListener('error', start);
  setTimeout(start, 8000);
})();
</script>
</body>
</html>
