<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="anqu-shell" content="1">
<meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>暗区突围保险模拟</title>
<link rel="stylesheet" href="css/shell.css">
</head>
<body>
<div class="loading-overlay" id="loading-overlay">
<div class="loading-container">
<div class="loading-text">暗区突围保险模拟</div>
<div class="loading-text"></div>
<div class="loading-spinner"></div>
<div class="loading-text">Loading•••</div>
<div class="loading-progress">
<div class="loading-progress-bar" id="loading-progress-bar"></div>
</div>
<div class="loading-tip" id="loading-tip"></div>
</div>
</div>
<div id="download-mode-modal" style="display:none;position:fixed;inset:0;z-index:2147483647;background:rgba(0,0,0,.6);align-items:center;justify-content:center;">
<div style="width:min(460px,90vw);background:#111827;color:#e5e7eb;border-radius:14px;padding:22px;box-shadow:0 24px 80px rgba(0,0,0,.6);">
<div style="font-size:18px;font-weight:700;">选择下载方式</div>
<div style="font-size:12px;color:#94a3b8;line-height:1.6;margin-top:10px;">完整下载：下载必要代码和全部资源（3D 模型、贴图、动画、背景、音乐、段位/收藏/名片资源），可离线使用全部功能和检视。</div>
<div style="font-size:12px;color:#94a3b8;line-height:1.6;margin-top:6px;">精简下载：只下载必要代码，先进入游戏；模型、背景、音乐等资源按需加载或稍后再下。</div>
<div style="font-size:12px;color:#f59e0b;line-height:1.6;margin-top:8px;">未完整下载时部分功能会受影响，但可以在游戏内「资源下载」功能补下。</div>
<div style="display:flex;gap:10px;margin-top:18px;">
<button id="download-mode-full" style="flex:1;padding:12px 10px;border-radius:9px;border:0;background:#2563eb;color:#fff;font-size:14px;font-weight:600;">完整下载</button>
<button id="download-mode-lite" style="flex:1;padding:12px 10px;border-radius:9px;border:1px solid #475569;background:transparent;color:#e5e7eb;font-size:14px;">精简下载</button>
</div>
</div>
</div>
<script>
(function(){
  if (location.search.indexOf('start=1') >= 0) {
    var a=document.createElement('script'); a.src='js/boot-download.js'; a.onload=function(){ var b=document.createElement('script'); b.src='js/shell.js'; document.body.appendChild(b); }; document.body.appendChild(a);
    return;
  }
  var KEY='ab_download_mode', DONE='ab_download_choice_v5';
  function loadScripts(){
    var a=document.createElement('script'); a.src='js/boot-download.js'; a.onload=function(){
      var b=document.createElement('script'); b.src='js/shell.js'; document.body.appendChild(b);
    }; document.body.appendChild(a);
  }
  var done=false;
  try { done=!!localStorage.getItem(DONE); } catch(e){}
  if (done) { loadScripts(); return; }
  var m=document.getElementById('download-mode-modal');
  if (!m) { loadScripts(); return; }
  m.style.display='flex';
  function close(v){
    try { localStorage.setItem(KEY,v); localStorage.setItem(DONE,'1'); } catch(e){}
    m.style.display='none';
    loadScripts();
  }
  document.getElementById('download-mode-full').onclick=function(){ close('full'); };
  document.getElementById('download-mode-lite').onclick=function(){ close('lite'); };
})();
</script>
</body>
</html>
