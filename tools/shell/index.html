<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="anqu-shell" content="1">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>ANQU</title>
<link rel="stylesheet" href="css/shell.css">
</head>
<body>
<div class="shell" data-anqu-shell="1">
  <div class="brand">
    <div class="brand-mark">ANQU</div>
    <div class="brand-sub">暗区保险模拟</div>
  </div>

  <div class="panel">
    <div class="status" id="status">正在校验客户端…</div>
    <div class="bar"><i id="bar"></i></div>
    <div class="detail" id="detail">正在准备运行文件</div>
    <button class="retry" id="retry">重 试</button>
  </div>

  <div class="foot">
    <span id="ver">v2.1.0</span>
    <span class="dot"></span>
    <span id="net">已连接</span>
  </div>
</div>
<script src="js/shell.js"></script>
</body>
</html>
