<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>手套预览</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:transparent;overflow:hidden}
#app{position:fixed;inset:0}
#status{display:none}
</style>
</head>
<body>
<div id="app"></div>
<div id="loading" style="position:fixed;inset:0;display:none;align-items:center;justify-content:center;z-index:20;pointer-events:none;"><div style="width:36px;height:36px;border:3px solid rgba(255,255,255,.18);border-top-color:#8fd4ff;border-radius:50%;animation:__spin 1s linear infinite;"></div></div>
<style>@keyframes __spin{to{transform:rotate(360deg)}}</style>
<script type="module">
import * as THREE from './vendor/three/three.module.js';
import { GLTFLoader } from './vendor/three/addons/loaders/GLTFLoader.js';
import { RoomEnvironment } from './vendor/three/addons/environments/RoomEnvironment.js';

const P0 = new URLSearchParams(location.search);
const KIND = P0.get('gloves') || localStorage.getItem('ab_lion_gloves') || 'g05';
const SPECIAL = {
    kurt: ['gloves_kurt_quit', 'sniper'],
    snow: ['gloves_snow_retarget', 'snow'],
    xmas: ['gloves_xmas_uit', 'xmas'],
    rolf: ['', 'gloves']
};
const spec = KIND === 'g04' ? ['g04', 'g04'] : (SPECIAL[KIND] || [KIND, KIND]);
const NEED = [
    'lion/character.glb', 'lion/bernard1.glb',
    'lion/' + spec[1] + '_D.png', 'lion/' + spec[1] + '_N.png', 'lion/' + spec[1] + '_MAR.png',
    'lion/bernard_torso_D.png', 'lion/bernard_torso_N.png', 'lion/bernard_torso_MAR.png',
    'lion/bernard_leg_D.png', 'lion/bernard_leg_N.png', 'lion/bernard_leg_MAR.png',
    'lion/bernard_shoes_D.png', 'lion/bernard_shoes_N.png', 'lion/bernard_shoes_MAR.png'
];
if (spec[0]) NEED.push('lion/' + spec[0] + '.glb');

const IDB_MAP = await (async function () {
    try {
        return await new Promise(function (resolve) {
            const map = {};
            const req = indexedDB.open('anqu_resources');
            req.onerror = function () { resolve(map); };
            req.onsuccess = function () {
                const db = req.result;
                try {
                    if (!db.objectStoreNames.contains('assets')) { resolve(map); return; }
                    const tx = db.transaction('assets', 'readonly');
                    const store = tx.objectStore('assets');
                    let pending = NEED.length;
                    if (!pending) { resolve(map); return; }
                    NEED.forEach(function (p) {
                        const g = store.get(p);
                        g.onsuccess = function () {
                            const r = g.result;
                            if (r && r.blob) { try { map[p] = URL.createObjectURL(r.blob); } catch (e) {} }
                            if (--pending === 0) resolve(map);
                        };
                        g.onerror = function () { if (--pending === 0) resolve(map); };
                    });
                } catch (e) { resolve(map); }
            };
        });
    } catch (e) { return {}; }
})();
THREE.DefaultLoadingManager.setURLModifier(function (url) {
    const n = url.indexOf('./') === 0 ? url.slice(2) : url;
    return IDB_MAP[n] || url;
});

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio || 1, 4));
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.setClearAlpha(0);
document.getElementById('app').appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = null;
const camera = new THREE.PerspectiveCamera(32, innerWidth / innerHeight, 0.01, 100);
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
scene.environmentIntensity = 0.75;
scene.add(new THREE.HemisphereLight(0xbfd4ff, 0x141a22, 1.8));
const key = new THREE.DirectionalLight(0xffffff, 2.2);
key.position.set(3, 5, 4);
scene.add(key);
const rim = new THREE.DirectionalLight(0x6ea8ff, 1.4);
rim.position.set(-3, 3, -3);
scene.add(rim);

const GLOVE_MAP164 = [0, 1, 2, 3, 4, 5, 6, 17, 18, 19, 20, 21, 22, 23, 24, 25, 37, 38, 39, 40, 63, 64, 65, 66, 67, 68, 69, 70, 71, 72, 73, 74, 81, 82, 83, 84, 85, 86, 87, 88, 89, 90, 91, 92, 93, 96, 97, 98, 103, 104, 105, 106, 107, 108, 109, 110, 111, 112, 113, 114, 120, 121, 122, 123, 124, 125, 126, 127, 128, 129, 130, 131, 134, 135, 136, 141, 142, 143, 144, 145, 146, 147, 148, 160, 161, 162, 163];
function remap164(geo) {
    const si = geo.attributes.skinIndex, sw = geo.attributes.skinWeight;
    if (!si || !sw) return geo;
    const n = si.count, out = new Uint16Array(n * 4);
    for (let v = 0; v < n; v++) {
        for (let k = 0; k < 4; k++) {
            const idx = si.getComponent(v, k);
            const w = sw.getComponent(v, k);
            const m = (w > 0 && idx < GLOVE_MAP164.length) ? GLOVE_MAP164[idx] : 0;
            out[v * 4 + k] = m >= 0 ? m : 0;
        }
    }
    const g = geo.clone();
    g.setAttribute('skinIndex', new THREE.Uint16BufferAttribute(out, 4));
    return g;
}

const loader = new GLTFLoader();
let bernard = null;
let rolf = null;
let rolfGlove = null;
let rolfXmas = null;
let rolfBaseGeo = null;
const center = new THREE.Vector3();
let dist = 3.0;
let ang = 0.35;

function tex(path, srgb) {
    const t = new THREE.TextureLoader().load(path);
    t.flipY = false;
    t.anisotropy = renderer.capabilities.getMaxAnisotropy();
    t.minFilter = THREE.LinearMipmapLinearFilter;
    t.magFilter = THREE.LinearFilter;
    if (srgb) t.colorSpace = THREE.SRGBColorSpace;
    return t;
}

function gloveMaterial(base) {
    return new THREE.MeshStandardMaterial({
        map: tex('./lion/' + base + '_D.png', true),
        normalMap: tex('./lion/' + base + '_N.png'),
        normalScale: new THREE.Vector2(1.1, 1.1),
        side: THREE.DoubleSide, roughness: 0.95, metalness: 0.0, envMapIntensity: 0.25
    });
}

function applyGlove() {
    if (!rolfGlove) return;
    if (KIND === 'xmas') {
        rolfGlove.visible = false;
        if (rolfXmas) {
            rolfXmas.visible = true;
            rolfXmas.material = gloveMaterial('xmas');
        }
        return;
    }
    if (rolfXmas) rolfXmas.visible = false;
    if (KIND === 'rolf' || !spec[0]) {
        rolfGlove.geometry = rolfBaseGeo;
        rolfGlove.material = gloveMaterial('gloves');
        rolfGlove.visible = true;
        return;
    }
    loader.load('./lion/' + spec[0] + '.glb', function (gltf) {
        let mesh = null;
        gltf.scene.traverse(function (o) { if (!mesh && o.isMesh) mesh = o; });
        if (!mesh) return;
        let geo = mesh.geometry;
        if (/^g\d\d$/.test(KIND) || KIND === 'g04') geo = remap164(geo);
        rolfGlove.geometry = geo;
        rolfGlove.material = gloveMaterial(spec[1]);
        rolfGlove.visible = true;
    }, undefined, function (e) { console.error(e); });
}

function loadGLB(p) {
    return new Promise(function (resolve, reject) {
        loader.load(p, resolve, undefined, reject);
    });
}

Promise.all([
    loadGLB('./lion/character.glb'),
    loadGLB('./lion/bernard1.glb')
]).then(function (list) {
    rolf = list[0].scene;
    rolf.scale.setScalar(0.01);
    rolf.rotation.y = Math.PI;
    rolf.traverse(function (o) {
        if (!o.isMesh) return;
        o.frustumCulled = false;
        const n = (o.name || '').toLowerCase();
        if (n.indexOf('glove') >= 0 && n.indexOf('xmas') >= 0) {
            rolfXmas = o;
            o.visible = false;
            o.material = gloveMaterial('xmas');
        } else if (n.indexOf('glove') >= 0) {
            if (!rolfGlove) { rolfGlove = o; rolfBaseGeo = o.geometry; }
            o.visible = true;
            o.material = gloveMaterial('gloves');
        } else {
            o.visible = false;
        }
    });
    scene.add(rolf);

    bernard = list[1].scene;
    bernard.scale.setScalar(0.01);
    bernard.rotation.y = Math.PI;
    bernard.traverse(function (o) {
        if (!o.isMesh) return;
        o.frustumCulled = false;
        const n = (o.name || '').toLowerCase();
        if (n.indexOf('glove') >= 0) {
            o.visible = false;
        } else if (n.indexOf('torso') >= 0) {
            o.visible = true;
            o.material = new THREE.MeshStandardMaterial({ map: tex('./lion/bernard_torso_D.png', true), normalMap: tex('./lion/bernard_torso_N.png'), roughnessMap: tex('./lion/bernard_torso_MAR.png'), metalnessMap: tex('./lion/bernard_torso_MAR.png'), side: THREE.DoubleSide, roughness: 0.8, metalness: 0.05 });
        } else if (n.indexOf('leg') >= 0) {
            o.visible = true;
            o.material = new THREE.MeshStandardMaterial({ map: tex('./lion/bernard_leg_D.png', true), normalMap: tex('./lion/bernard_leg_N.png'), roughnessMap: tex('./lion/bernard_leg_MAR.png'), metalnessMap: tex('./lion/bernard_leg_MAR.png'), side: THREE.DoubleSide, roughness: 0.8, metalness: 0.05 });
        } else if (n.indexOf('shoe') >= 0) {
            o.visible = true;
            o.material = new THREE.MeshStandardMaterial({ map: tex('./lion/bernard_shoes_D.png', true), normalMap: tex('./lion/bernard_shoes_N.png'), roughnessMap: tex('./lion/bernard_shoes_MAR.png'), metalnessMap: tex('./lion/bernard_shoes_MAR.png'), side: THREE.DoubleSide, roughness: 0.8, metalness: 0.05 });
        } else {
            o.visible = false;
        }
    });
    scene.add(bernard);
    bernard.updateMatrixWorld(true);

    const box = new THREE.Box3().setFromObject(bernard);
    if (!box.isEmpty()) {
        box.getCenter(center);
        const size = box.getSize(new THREE.Vector3());
        center.y += size.y * 0.05;
        dist = Math.max(size.y * 1.0, 1.7);
    }

    applyGlove();
    const l = document.getElementById('loading');
    if (l) l.style.display = 'none';
    try { parent.postMessage('inspect-ready', '*'); } catch (e) {}
}).catch(function (e) {
    console.error(e);
    const l = document.getElementById('loading');
    if (l) l.style.display = 'none';
    try { parent.postMessage('inspect-ready', '*'); } catch (e) {}
});

addEventListener('click', function () {
    try { parent.postMessage('glove-preview-close', '*'); } catch (e) {}
});

addEventListener('message', function (e) {
    if (typeof e.data === 'string' && e.data.indexOf('gloves:') === 0) {
        location.href = 'glove-preview.html?gloves=' + encodeURIComponent(e.data.slice(7)) + '&t=' + Date.now();
    }
});

addEventListener('resize', function () {
    camera.aspect = innerWidth / innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(innerWidth, innerHeight);
});

function animate() {
    requestAnimationFrame(animate);
    ang += 0.012;
    camera.position.set(
        center.x + Math.sin(ang) * dist,
        center.y + dist * 0.1,
        center.z + Math.cos(ang) * dist
    );
    camera.lookAt(center);
    renderer.render(scene, camera);
}
animate();
</script>
</body>
</html>
