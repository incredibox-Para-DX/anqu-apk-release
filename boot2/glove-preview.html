<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>手套预览</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:transparent;overflow:hidden}
#app{position:fixed;inset:0}
#status{position:fixed;left:12px;bottom:10px;font:11px -apple-system,sans-serif;color:#64748b;z-index:5}
</style>
</head>
<body>
<div id="app"></div>
<div id="status">加载中…</div>
<script type="module">
import * as THREE from './vendor/three/three.module.js';
import { GLTFLoader } from './vendor/three/addons/loaders/GLTFLoader.js';
import { RoomEnvironment } from './vendor/three/addons/environments/RoomEnvironment.js';

const MAP = (window.parent && window.parent.__lionUrlMap) || {};
THREE.DefaultLoadingManager.setURLModifier(function (url) {
    const n = url.indexOf('./') === 0 ? url.slice(2) : url;
    return MAP[n] || url;
});

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio || 1, 3));
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.setClearAlpha(0);
document.getElementById('app').appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = null;
const camera = new THREE.PerspectiveCamera(45, innerWidth / innerHeight, 0.01, 100);
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
scene.environmentIntensity = 0.75;
scene.add(new THREE.HemisphereLight(0xbfd4ff, 0x141a22, 1.8));
const key = new THREE.DirectionalLight(0xffffff, 2.2);
key.position.set(3, 5, 4);
scene.add(key);
const rim = new THREE.DirectionalLight(0x6ea8ff, 1.4);
rim.position.set(-3, 3, -3);
scene.add(rim);

const loader = new GLTFLoader();
let mixer = null;
let clips = [];
let current = 0;
let center = new THREE.Vector3(0, 1, 0);
let dist = 1.6;
let ang = 0.6;

function setStatus(t) {
    const el = document.getElementById('status');
    if (el) el.textContent = t;
}

function play(i) {
    if (!clips.length || !mixer) return;
    current = ((i % clips.length) + clips.length) % clips.length;
    mixer.stopAllAction();
    const action = mixer.clipAction(clips[current]);
    action.setLoop(THREE.LoopOnce, 1);
    action.clampWhenFinished = true;
    action.reset();
    action.play();
}

function loadOne(n) {
    return new Promise(function (resolve, reject) {
        loader.load('./lion/bernard' + n + '.glb', resolve, undefined, reject);
    });
}

Promise.all([loadOne(1), loadOne(2), loadOne(3)]).then(function (list) {
    const model = list[0].scene;
    model.scale.setScalar(0.01);
    model.traverse(function (o) {
        if (!o.isMesh) return;
        o.frustumCulled = false;
        o.visible = /glove/i.test(o.name || '');
    });
    scene.add(model);
    model.updateMatrixWorld(true);

    let glove = null;
    model.traverse(function (o) { if (!glove && o.isMesh && o.visible) glove = o; });
    if (glove) {
        const tD = new THREE.TextureLoader().load('./lion/bernard_gloves_D.png');
        const tN = new THREE.TextureLoader().load('./lion/bernard_gloves_N.png');
        const tM = new THREE.TextureLoader().load('./lion/bernard_gloves_MAR.png');
        tD.colorSpace = THREE.SRGBColorSpace;
        tD.flipY = false;
        tN.flipY = false;
        tM.flipY = false;
        glove.material = new THREE.MeshStandardMaterial({
            map: tD, normalMap: tN, roughnessMap: tM, metalnessMap: tM,
            side: THREE.DoubleSide, roughness: 0.75, metalness: 0.05
        });
        const box = new THREE.Box3().setFromObject(glove);
        if (!box.isEmpty()) {
            box.getCenter(center);
            const size = box.getSize(new THREE.Vector3());
            dist = Math.max(size.x, size.y, size.z) * 2.4 + 0.35;
        }
    }

    clips = list.map(function (g) { return g.animations && g.animations[0]; }).filter(Boolean);
    if (clips.length) {
        mixer = new THREE.AnimationMixer(model);
        mixer.addEventListener('finished', function () { play(current + 1); });
        play(0);
    }
    setStatus(clips.length ? '' : '动作缺失');
}).catch(function (e) {
    console.error(e);
    setStatus('模型加载失败');
});

addEventListener('resize', function () {
    camera.aspect = innerWidth / innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(innerWidth, innerHeight);
});

const clock = new THREE.Clock();
function animate() {
    requestAnimationFrame(animate);
    const dt = Math.min(clock.getDelta(), 0.05);
    if (mixer) mixer.update(dt);
    ang += dt * 0.35;
    camera.position.set(
        center.x + Math.sin(ang) * dist,
        center.y + 0.12,
        center.z + Math.cos(ang) * dist
    );
    camera.lookAt(center);
    renderer.render(scene, camera);
}
animate();
</script>
</body>
</html>
