<div id="__mg_back_btn" style="position:fixed;top:12px;left:12px;z-index:2147483647;background:rgba(0,0,0,0.75);color:#fff;padding:10px 16px;border-radius:8px;font-size:14px;font-family:-apple-system,sans-serif;cursor:pointer;border:1px solid rgba(255,255,255,0.2);box-shadow:0 2px 8px rgba(0,0,0,0.4);user-select:none;display:none;">← 返回</div>
<script>
(function(){
    var btn = document.getElementById('__mg_back_btn');
    if (!btn) return;
    
    var lang = 'zh-CN';
    try { lang = localStorage.getItem('ab_app_lang') || (window.parent && window.parent.I18N && window.parent.I18N.getLang()) || 'zh-CN'; } catch(e) {}
    var backMap = { 'en': '← Back', 'ru': '← Назад', 'zh-TW': '← 返回', 'zh-CN': '← 返回' };
    btn.textContent = backMap[lang] || '← 返回';
    
    setTimeout(function(){ btn.style.display = 'block'; }, 1500);
    btn.addEventListener('click', function(){
        try {
            
            if (history.length > 1) {
                history.back();
            } else {
                
                location.href = '../index.html';
            }
        } catch(e) {}
    });
})();
</script>
