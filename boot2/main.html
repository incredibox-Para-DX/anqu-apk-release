<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>LoginCG</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }
body {
  display: flex; align-items: center; justify-content: center;
  user-select: none; -webkit-user-select: none; -moz-user-select: none; -ms-user-select: none;
  -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
}
video {
  width: 100%; height: 100%; object-fit: cover;
  outline: none; -webkit-outline: none;
}
</style>
</head>
<body>
<video id="video" src="backgrounds/Login/LoginCG.mp4" autoplay playsinline webkit-playsinline x5-playsinline x-webkit-airplay="allow" poster="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNk+M9QDwADhgGAWjR9awAAAABJRU5ErkJggg==" preload="auto"></video>
<script>
var video = document.getElementById('video');
var soundEnabled = false;

function enableSound() {
  if (!soundEnabled) {
    soundEnabled = true;
    video.muted = false;
    video.volume = 1;
    video.play();
  }
}

video.addEventListener('ended', function() {
  window.location.href = 'index.html';
});

video.addEventListener('play', function() {
  if (soundEnabled) video.muted = false;
});

document.addEventListener('touchstart', enableSound, { once: true });
document.addEventListener('click', enableSound, { once: true });
document.addEventListener('keydown', enableSound, { once: true });

document.addEventListener('contextmenu', function(e) { e.preventDefault(); });
document.addEventListener('selectstart', function(e) { e.preventDefault(); });
document.addEventListener('copy', function(e) { e.preventDefault(); });
document.addEventListener('dragstart', function(e) { e.preventDefault(); });
</script>
</body>
</html>
