<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>机密文件检视</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:transparent;overflow:hidden}
#app{position:fixed;inset:0}
#status{position:fixed;left:12px;bottom:10px;font:11px -apple-system,sans-serif;color:#64748b;z-index:5}
</style>
</head>
<body>
<div id="app"></div>
<div id="status">加载中…</div>
<script type="module">
import * as THREE from './vendor/three/three.module.js';
import { GLTFLoader } from './vendor/three/addons/loaders/GLTFLoader.js';
import { RoomEnvironment } from './vendor/three/addons/environments/RoomEnvironment.js';

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio || 1, 3));
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.getElementById('app').appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = null;
const camera = new THREE.PerspectiveCamera(80, innerWidth / innerHeight, 0.01, 100);

const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
scene.environmentIntensity = 0.7;
scene.add(new THREE.HemisphereLight(0xbfd4ff, 0x141a22, 1.6));
const key = new THREE.DirectionalLight(0xffffff, 2.4);
key.position.set(3, 5, 4);
scene.add(key);
const rim = new THREE.DirectionalLight(0x6ea8ff, 1.6);
rim.position.set(-3, 3, -3);
scene.add(rim);

function loadColor(url) {
  const t = new THREE.TextureLoader().load(url);
  t.flipY = false;
  t.colorSpace = THREE.SRGBColorSpace;
  t.anisotropy = renderer.capabilities.getMaxAnisotropy();
  t.minFilter = THREE.LinearMipmapLinearFilter;
  t.generateMipmaps = true;
  return t;
}
function loadData(url) {
  const t = new THREE.TextureLoader().load(url);
  t.flipY = false;
  t.anisotropy = renderer.capabilities.getMaxAnisotropy();
  return t;
}

const texSnow = loadColor('./lion/snow_D.png');
const texSnowN = loadData('./lion/snow_N.png');
const texSnowMAR = loadData('./lion/snow_MAR.png');
const texTorso = loadColor('./lion/torso_D.png');
const texTorsoN = loadData('./lion/torso_N.png');
const texLeg = loadColor('./lion/leg_D.png');
const texLegN = loadData('./lion/leg_N.png');
const texShoe = loadColor('./lion/shoes_D.png');
const texHead = loadColor('./lion/head_D.png');
const texHeadN = loadData('./lion/head_N.png');
const texFile = loadColor('./lion/secretfile_D.png');
const texFileN = loadData('./lion/secretfile_N.png');
const texFileMA = loadData('./lion/secretfile_MA.png');

const loader = new GLTFLoader();
const tmp = new THREE.Vector3();
let mixers = [];
let actions = [];

function setupCharacter(gltf) {
  const model = gltf.scene;
  model.scale.setScalar(0.01);
  model.traverse((o) => {
    if (!o.isMesh) return;
    o.frustumCulled = false;
    const nm = (o.name || '').toLowerCase();
    if (nm.includes('glove')) {
      o.material = new THREE.MeshStandardMaterial({ map: texSnow, normalMap: texSnowN, roughnessMap: texSnowMAR, metalnessMap: texSnowMAR, side: THREE.DoubleSide, roughness: 1, metalness: 1, envMapIntensity: 1.2 });
    } else if (nm.includes('leg')) {
      o.material = new THREE.MeshStandardMaterial({ map: texLeg, normalMap: texLegN, side: THREE.DoubleSide, roughness: 0.8, metalness: 0.05 });
    } else if (nm.includes('shoe')) {
      o.material = new THREE.MeshStandardMaterial({ map: texShoe, side: THREE.DoubleSide, roughness: 0.8, metalness: 0.05 });
    } else if (nm.includes('head')) {
      o.material = new THREE.MeshStandardMaterial({ map: texHead, normalMap: texHeadN, side: THREE.DoubleSide, roughness: 0.75, metalness: 0.05 });
      o.visible = false;
    } else if (nm.includes('torso')) {
      o.material = new THREE.MeshStandardMaterial({ map: texTorso, normalMap: texTorsoN, side: THREE.DoubleSide, roughness: 0.8, metalness: 0.05 });
    }
  });
  scene.add(model);
  model.updateMatrixWorld(true);
  window.__model = model;
  window.__head = model.getObjectByName('head') || model.getObjectByName('neck_01');
  window.__socket = model.getObjectByName('item_r') || model.getObjectByName('item_l') || model.getObjectByName('hand_r');

  gltf.animations.forEach((clip) => {
    const mixer = new THREE.AnimationMixer(model);
    const action = mixer.clipAction(clip);
    action.setLoop(THREE.LoopOnce, 1);
    action.clampWhenFinished = true;
    action.play();
    if (clip.name.indexOf('.002') < 0) {
      mixer.addEventListener('finished', function () {
        try { parent.closeLionInspect(); } catch (e) {}
      });
    }
    mixers.push(mixer);
    actions.push(action);
  });
  document.getElementById('status').textContent = '';
}

function setupProp(gltf) {
  const prop = gltf.scene;
  prop.traverse((o) => {
    if (!o.isMesh) return;
    o.frustumCulled = false;
    o.material = new THREE.MeshStandardMaterial({ map: texFile, normalMap: texFileN, roughnessMap: texFileMA, metalnessMap: texFileMA, side: THREE.DoubleSide, roughness: 1, metalness: 1, envMapIntensity: 1.2 });
  });
  const attach = () => {
    if (window.__socket) {
      window.__socket.add(prop);
      prop.scale.setScalar(1);
      prop.position.set(0, 0, 0);
      prop.rotation.set(0, 0, 0);
    } else {
      setTimeout(attach, 200);
    }
  };
  attach();
}

loader.load('./lion/secretfile_character.glb', setupCharacter, undefined, (e) => {
  document.getElementById('status').textContent = '角色加载失败';
  console.error(e);
});
loader.load('./lion/secretfile.glb', setupProp, undefined, (e) => console.error(e));

window.addEventListener('message', (e) => {
  if (e.data !== 'lion-replay') return;
  actions.forEach((a) => { try { a.reset(); a.play(); } catch (err) {} });
});

document.addEventListener('click', function () {
  try { parent.closeLionInspect(); } catch (e) {}
});

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

const clock = new THREE.Clock();
function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);
  mixers.forEach((m) => m.update(dt));
  if (window.__head) {
    window.__head.getWorldPosition(tmp);
    camera.position.copy(tmp);
    camera.position.y += 0.1;
    if (window.__socket) {
      window.__socket.getWorldPosition(camera.__target || (camera.__target = new THREE.Vector3()));
      const target = camera.__target;
      const dir = target.clone().sub(camera.position).normalize();
      const right = new THREE.Vector3().crossVectors(dir, new THREE.Vector3(0, 1, 0)).normalize();
      camera.position.addScaledVector(right, -0.05);
      const look = target.clone();
      look.y += 0.15;
      camera.lookAt(look);
    }
  }
  if (camera.fov !== 80) { camera.fov = 80; camera.updateProjectionMatrix(); }
  renderer.render(scene, camera);
}
animate();
</script>
</body>
</html>
