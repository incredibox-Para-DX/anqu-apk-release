<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>机密文件检视</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:transparent;overflow:hidden}
#app{position:fixed;inset:0}
#status{position:fixed;left:12px;bottom:10px;font:11px -apple-system,sans-serif;color:#64748b;z-index:5}
</style>
</head>
<body>
<div id="app"></div>
<div id="ui" style="position:fixed;left:8px;bottom:8px;z-index:50;background:rgba(15,20,28,.9);padding:8px;border-radius:8px;display:flex;flex-direction:column;gap:3px;">
<label style="font:11px sans-serif;color:#94a3b8;">X <input type="range" id="px" min="-2" max="2" step="0.01" value="0"> <input type="number" id="pxn" step="0.01" value="0" style="width:56px;background:#0b0e13;color:#e2e8f0;border:1px solid #334155;border-radius:4px;font:11px sans-serif;"></label>
<label style="font:11px sans-serif;color:#94a3b8;">Y <input type="range" id="py" min="-2" max="2" step="0.01" value="0.12"> <input type="number" id="pyn" step="0.01" value="0.12" style="width:56px;background:#0b0e13;color:#e2e8f0;border:1px solid #334155;border-radius:4px;font:11px sans-serif;"></label>
<label style="font:11px sans-serif;color:#94a3b8;">Z <input type="range" id="pz" min="-2" max="2" step="0.01" value="0.04"> <input type="number" id="pzn" step="0.01" value="0.04" style="width:56px;background:#0b0e13;color:#e2e8f0;border:1px solid #334155;border-radius:4px;font:11px sans-serif;"></label>
<label style="font:11px sans-serif;color:#94a3b8;">S <input type="range" id="sc" min="0.01" max="5" step="0.01" value="0.2"> <input type="number" id="scn" step="0.01" value="0.2" style="width:56px;background:#0b0e13;color:#e2e8f0;border:1px solid #334155;border-radius:4px;font:11px sans-serif;"></label>
<label style="font:11px sans-serif;color:#94a3b8;">RX <input type="range" id="rx" min="-3.14" max="3.14" step="0.01" value="0"> <input type="number" id="rxn" step="0.01" value="0" style="width:56px;background:#0b0e13;color:#e2e8f0;border:1px solid #334155;border-radius:4px;font:11px sans-serif;"></label>
<label style="font:11px sans-serif;color:#94a3b8;">RY <input type="range" id="ry" min="-3.14" max="3.14" step="0.01" value="0"> <input type="number" id="ryn" step="0.01" value="0" style="width:56px;background:#0b0e13;color:#e2e8f0;border:1px solid #334155;border-radius:4px;font:11px sans-serif;"></label>
<label style="font:11px sans-serif;color:#94a3b8;">RZ <input type="range" id="rz" min="-3.14" max="3.14" step="0.01" value="0"> <input type="number" id="rzn" step="0.01" value="0" style="width:56px;background:#0b0e13;color:#e2e8f0;border:1px solid #334155;border-radius:4px;font:11px sans-serif;"></label>
</div>
<div id="v268" style="position:fixed;top:8px;left:50%;transform:translateX(-50%);color:#4ade80;font:14px sans-serif;z-index:40;">v268</div>
<div id="status">加载中…</div>
<script type="module">
const ASSET = './';
import * as THREE from './vendor/three/three.module.js';
import { GLTFLoader } from './vendor/three/addons/loaders/GLTFLoader.js';
import { RoomEnvironment } from './vendor/three/addons/environments/RoomEnvironment.js';

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio || 1, 3));
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.getElementById('app').appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = null;
const camera = new THREE.PerspectiveCamera(80, innerWidth / innerHeight, 0.01, 100);

const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
scene.environmentIntensity = 0.7;
scene.add(new THREE.HemisphereLight(0xbfd4ff, 0x141a22, 1.6));
const key = new THREE.DirectionalLight(0xffffff, 2.4);
key.position.set(3, 5, 4);
scene.add(key);
const rim = new THREE.DirectionalLight(0x6ea8ff, 1.6);
rim.position.set(-3, 3, -3);
scene.add(rim);

function loadColor(url) {
  const t = new THREE.TextureLoader().load(url);
  t.flipY = false;
  t.colorSpace = THREE.SRGBColorSpace;
  t.anisotropy = renderer.capabilities.getMaxAnisotropy();
  return t;
}
function loadData(url) {
  const t = new THREE.TextureLoader().load(url);
  t.flipY = false;
  t.anisotropy = renderer.capabilities.getMaxAnisotropy();
  return t;
}

const texSnow = loadColor(ASSET + 'lion/snow_D.png');
const texSnowN = loadData(ASSET + 'lion/snow_N.png');
const texSnowMAR = loadData(ASSET + 'lion/snow_MAR.png');
const texTorso = loadColor(ASSET + 'lion/torso_D.png');
const texTorsoN = loadData(ASSET + 'lion/torso_N.png');
const texLeg = loadColor(ASSET + 'lion/leg_D.png');
const texLegN = loadData(ASSET + 'lion/leg_N.png');
const texShoe = loadColor(ASSET + 'lion/shoes_D.png');
const texHead = loadColor(ASSET + 'lion/head_D.png');
const texHeadN = loadData(ASSET + 'lion/head_N.png');
const texFile = loadColor(ASSET + 'lion/secretfile_D.png');
const texFileN = loadData(ASSET + 'lion/secretfile_N.png');

const loader = new GLTFLoader();
const tmp = new THREE.Vector3();
let mixers = [];
let actions = [];

function setupCharacter(gltf) {
  const model = gltf.scene;
  model.scale.setScalar(0.01);
  model.traverse(function (o) {
    if (!o.isMesh) return;
    o.frustumCulled = false;
    const nm = (o.name || '').toLowerCase();
    if (nm.indexOf('glove') >= 0) {
      o.material = new THREE.MeshStandardMaterial({ map: texSnow, normalMap: texSnowN, roughnessMap: texSnowMAR, metalnessMap: texSnowMAR, side: THREE.DoubleSide, roughness: 1, metalness: 1 });
    } else if (nm.indexOf('leg') >= 0) {
      o.material = new THREE.MeshStandardMaterial({ map: texLeg, normalMap: texLegN, side: THREE.DoubleSide, roughness: 0.8, metalness: 0.05 });
    } else if (nm.indexOf('shoe') >= 0) {
      o.material = new THREE.MeshStandardMaterial({ map: texShoe, side: THREE.DoubleSide, roughness: 0.8, metalness: 0.05 });
    } else if (nm.indexOf('head') >= 0) {
      o.material = new THREE.MeshStandardMaterial({ map: texHead, normalMap: texHeadN, side: THREE.DoubleSide, roughness: 0.75, metalness: 0.05 });
      o.visible = false;
    } else if (nm.indexOf('torso') >= 0) {
      o.material = new THREE.MeshStandardMaterial({ map: texTorso, normalMap: texTorsoN, side: THREE.DoubleSide, roughness: 0.8, metalness: 0.05 });
    }
  });
  scene.add(model);
  model.updateMatrixWorld(true);
  window.__model = model;
  window.__head = model.getObjectByName('head') || model.getObjectByName('neck_01');
  window.__socket = model.getObjectByName('item_r') || model.getObjectByName('item_rSocket') || model.getObjectByName('hand_r');

  gltf.animations.forEach(function (clip) {
    const mixer = new THREE.AnimationMixer(model);
    const action = mixer.clipAction(clip);
    action.setLoop(THREE.LoopRepeat, Infinity);
    action.clampWhenFinished = false;
    action.play();
    mixers.push(mixer);
    actions.push(action);
  });
  document.getElementById('status').textContent = 'anim=' + gltf.animations.length + ' socket=' + (window.__socket ? window.__socket.name : 'none');
}

function setupProp(gltf) {
  const prop = gltf.scene;
  prop.traverse(function (o) {
    if (!o.isMesh) return;
    if (!o.geometry.attributes.normal) o.geometry.computeVertexNormals();
    o.material = new THREE.MeshStandardMaterial({ map: texFile, normalMap: texFileN, side: THREE.DoubleSide, roughness: 0.7, metalness: 0.0 });
  });
  window.__prop = prop;
  window.__prop = prop;
  const attach = function () {
    if (window.__socket) {
      window.__socket.add(prop);
      prop.scale.setScalar(0.2);
      prop.position.set(0, 0, 0);
      prop.rotation.set(0, 0, 0);
    } else {
      scene.add(prop);
      prop.scale.setScalar(0.2);
      prop.position.set(0, 1.0, 0.6);
    }
  };
  attach();
  document.getElementById('status').textContent += ' prop=ok';
}

loader.load(ASSET + 'lion/secretfile_character.glb', setupCharacter, undefined, function (e) {
  document.getElementById('status').textContent = 'role fail';
  console.error(e);
});
loader.load(ASSET + 'lion/secretfile.glb', setupProp, undefined, function (e) {
  document.getElementById('status').textContent += ' prop=fail';
  console.error(e);
});

document.addEventListener('click', function (e) {
  if (e.target && e.target.closest && e.target.closest('#ui')) return;
  try { parent.closeLionInspect(); } catch (err) {}
});

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

['px','py','pz','sc','rx','ry','rz'].forEach(function (id) {
  var r = document.getElementById(id);
  var n = document.getElementById(id + 'n');
  r.addEventListener('input', function () { n.value = r.value; });
  n.addEventListener('input', function () { r.value = n.value; });
});

const clock = new THREE.Clock();
function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);
  const tSec = clock.elapsedTime;
  mixers.forEach(function (m) {
    if (m._actions && m._actions.length && m._actions[0]._clip) {
      m.setTime(tSec % m._actions[0]._clip.duration);
    } else {
      m.update(dt);
    }
  });
  if (window.__prop) {
    var px = parseFloat(document.getElementById('pxn').value) || 0;
    var py = parseFloat(document.getElementById('pyn').value) || 0;
    var pz = parseFloat(document.getElementById('pzn').value) || 0;
    var sc = parseFloat(document.getElementById('scn').value) || 0.2;
    var rx = parseFloat(document.getElementById('rxn').value) || 0;
    var ry = parseFloat(document.getElementById('ryn').value) || 0;
    var rz = parseFloat(document.getElementById('rzn').value) || 0;
    if (window.__prop.parent === scene) {
      window.__prop.position.set(px, py, pz);
    } else {
      window.__prop.position.set(px, py, pz);
    }
    window.__prop.rotation.set(rx, ry, rz);
    window.__prop.scale.setScalar(sc);
  }
  if (window.__head) {
    window.__head.getWorldPosition(tmp);
    camera.position.copy(tmp);
    camera.position.y += 0.1;
    if (window.__socket) {
      window.__socket.getWorldPosition(camera.__target || (camera.__target = new THREE.Vector3()));
      const target = camera.__target;
      const dir = target.clone().sub(camera.position).normalize();
      camera.position.addScaledVector(dir, 0);
      camera.lookAt(target);
    }
  }
  renderer.render(scene, camera);
}
animate();
</script>
</body>
</html>
