<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>机密文件检视（调试）</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:transparent;overflow:hidden}
#app{position:fixed;inset:0}
#ui{position:fixed;left:10px;bottom:10px;z-index:10;background:rgba(15,20,28,.92);border:1px solid rgba(148,163,184,.2);border-radius:10px;padding:8px 10px;display:flex;flex-direction:column;gap:4px;max-height:75vh;overflow:auto}
#ui label{font:11px -apple-system,sans-serif;color:#94a3b8;display:flex;align-items:center;gap:6px}
#ui input[type=range]{width:120px}
#ui output{min-width:40px;text-align:right;color:#e2e8f0}
#status{font:11px -apple-system,sans-serif;color:#64748b}
</style>
</head>
<body>
<div id="app"></div>
<script type="module">
const ASSET = './';
import * as THREE from './vendor/three/three.module.js';
import { GLTFLoader } from './vendor/three/addons/loaders/GLTFLoader.js';
import { RoomEnvironment } from './vendor/three/addons/environments/RoomEnvironment.js';

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio || 1, 3));
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.getElementById('app').appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = null;
const camera = new THREE.PerspectiveCamera(80, innerWidth / innerHeight, 0.01, 100);

const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
scene.environmentIntensity = 0.7;
scene.add(new THREE.HemisphereLight(0xbfd4ff, 0x141a22, 1.6));
const key = new THREE.DirectionalLight(0xffffff, 2.4);
key.position.set(3, 5, 4);
scene.add(key);
const rim = new THREE.DirectionalLight(0x6ea8ff, 1.6);
rim.position.set(-3, 3, -3);
scene.add(rim);

function loadColor(url) {
  const t = new THREE.TextureLoader().load(url);
  t.flipY = false;
  t.colorSpace = THREE.SRGBColorSpace;
  t.anisotropy = renderer.capabilities.getMaxAnisotropy();
  return t;
}
function loadData(url) {
  const t = new THREE.TextureLoader().load(url);
  t.flipY = false;
  t.anisotropy = renderer.capabilities.getMaxAnisotropy();
  return t;
}

const texSnow = loadColor(ASSET + 'lion/snow_D.png');
const texSnowN = loadData(ASSET + 'lion/snow_N.png');
const texSnowMAR = loadData(ASSET + 'lion/snow_MAR.png');
const texTorso = loadColor(ASSET + 'lion/torso_D.png');
const texTorsoN = loadData(ASSET + 'lion/torso_N.png');
const texLeg = loadColor(ASSET + 'lion/leg_D.png');
const texLegN = loadData(ASSET + 'lion/leg_N.png');
const texShoe = loadColor(ASSET + 'lion/shoes_D.png');
const texHead = loadColor(ASSET + 'lion/head_D.png');
const texHeadN = loadData(ASSET + 'lion/head_N.png');
const texGlove = loadColor(ASSET + 'lion/gloves_D.png');
const texGloveN = loadData(ASSET + 'lion/gloves_N.png');
const texXmas = loadColor(ASSET + 'lion/xmas_D.png');
const texXmasN = loadData(ASSET + 'lion/xmas_N.png');
const texXmasMAR = loadData(ASSET + 'lion/xmas_MAR.png');
const texFile = loadColor(ASSET + 'lion/secretfile_D.png');
const texFileN = loadData(ASSET + 'lion/secretfile_N.png');
const texFileMA = loadData(ASSET + 'lion/secretfile_MA.png');

const loader = new GLTFLoader();
const tmp = new THREE.Vector3();
let mixers = [];
let actions = [];

function setupCharacter(gltf) {
  const model = gltf.scene;
  model.scale.setScalar(0.01);
  model.traverse((o) => {
    if (!o.isMesh) return;
    o.frustumCulled = false;
    const nm = (o.name || '').toLowerCase();
    if (nm.includes('glove')) {
      o.material = new THREE.MeshStandardMaterial({ map: texSnow, normalMap: texSnowN, roughnessMap: texSnowMAR, metalnessMap: texSnowMAR, side: THREE.DoubleSide, roughness: 1, metalness: 1, envMapIntensity: 1.2 });
    } else if (nm.includes('leg')) {
      o.material = new THREE.MeshStandardMaterial({ map: texLeg, normalMap: texLegN, side: THREE.DoubleSide, roughness: 0.8, metalness: 0.05 });
    } else if (nm.includes('shoe')) {
      o.material = new THREE.MeshStandardMaterial({ map: texShoe, side: THREE.DoubleSide, roughness: 0.8, metalness: 0.05 });
    } else if (nm.includes('head')) {
      o.material = new THREE.MeshStandardMaterial({ map: texHead, normalMap: texHeadN, side: THREE.DoubleSide, roughness: 0.75, metalness: 0.05 });
      o.visible = false;
    } else if (nm.includes('torso')) {
      o.material = new THREE.MeshStandardMaterial({ map: texTorso, normalMap: texTorsoN, side: THREE.DoubleSide, roughness: 0.8, metalness: 0.05 });
    }
  });
  scene.add(model);
  model.updateMatrixWorld(true);
  window.__model = model;
  window.__gloveMeshes = [];
  model.traverse(function (o) {
    if (o.isMesh && (o.name || '').toLowerCase().indexOf('glove') >= 0) window.__gloveMeshes.push(o);
  });
  window.__head = model.getObjectByName('head') || model.getObjectByName('neck_01');
  window.__socket = model.getObjectByName('item_rSocket') || model.getObjectByName('item_r') || model.getObjectByName('item_l') || model.getObjectByName('hand_r');
  document.getElementById('status').textContent = 'socket=' + (window.__socket ? window.__socket.name : 'none');
  document.getElementById('big1').textContent = 'role ok socket=' + (window.__socket ? window.__socket.name : 'none');

  const fps = 30;
  gltf.animations.forEach((clip) => {
    const start = Math.floor(0.2 * fps);
    const end = Math.max(start + 1, Math.floor((clip.duration - 0.8) * fps));
    const trimmed = THREE.AnimationUtils.subclip(clip, clip.name, start, end, fps);
    const mixer = new THREE.AnimationMixer(model);
    const action = mixer.clipAction(trimmed);
    action.setLoop(THREE.LoopOnce, 1);
    action.clampWhenFinished = true;
    action.reset();
    action.play();
    if (clip.name.indexOf('.002') < 0) {
      mixer.addEventListener('finished', function () {
        try { parent.closeLionInspect(); } catch (e) {}
      });
    }
    mixers.push(mixer);
    actions.push(action);
  });
  document.getElementById('status').textContent = '角色 ok';
}

function setupProp(gltf) {
  const prop = gltf.scene;
  prop.traverse((o) => {
    if (!o.isMesh) return;
    o.frustumCulled = false;
    o.material = new THREE.MeshStandardMaterial({ map: texFile, normalMap: texFileN, side: THREE.DoubleSide, roughness: 0.7, metalness: 0.0, envMapIntensity: 1.0 });
  });
  window.__prop = prop;
  prop.traverse(function (o) {
    if (o.isMesh) {
      if (!o.geometry.attributes.normal) o.geometry.computeVertexNormals();
      o.material = new THREE.MeshStandardMaterial({ map: texFile, normalMap: texFileN, side: THREE.DoubleSide, roughness: 0.7, metalness: 0.0, envMapIntensity: 1.0 });
    }
  });
  const attach = function () {
    if (window.__socket) {
      window.__socket.add(prop);
      prop.position.set(0, 0, 0);
      prop.scale.setScalar(1);
      prop.rotation.set(0, 0, 0);
      document.getElementById('big2').textContent = 'prop ok';
    } else {
      setTimeout(attach, 200);
    }
  };
  attach();
}

loader.load(ASSET + 'lion/secretfile_character.glb', setupCharacter, undefined, (e) => {
  document.getElementById('status').textContent = '角色加载失败';
  console.error(e);
});
loader.load(ASSET + 'lion/gloves_rolf_uit.glb', function (gltf) {
  gltf.scene.traverse(function (o) { if (o.isMesh && !window.__rolfGeo) window.__rolfGeo = o.geometry; });
  applyGloves();
}, undefined, function (e) { console.error(e); });
loader.load(ASSET + 'lion/gloves_xmas_uit.glb', function (gltf) {
  gltf.scene.traverse(function (o) { if (o.isMesh && !window.__xmasGeo) window.__xmasGeo = o.geometry; });
  applyGloves();
}, undefined, function (e) { console.error(e); });

function applyGloves() {
  const kind = new URLSearchParams(location.search).get('gloves') || localStorage.getItem('ab_lion_gloves') || 'rolf';
  const mesh = (window.__gloveMeshes || [])[0];
  if (!mesh) return;
  if (!window.__snowGeoBackup) window.__snowGeoBackup = mesh.geometry;
  if (!window.__snowMatBackup) window.__snowMatBackup = mesh.material;
  if (kind === 'rolf' && window.__rolfGeo) {
    mesh.geometry = window.__rolfGeo;
    mesh.material = new THREE.MeshStandardMaterial({ map: texGlove, normalMap: texGloveN, side: THREE.DoubleSide, roughness: 0.75, metalness: 0.05 });
  } else if (kind === 'xmas' && window.__xmasGeo) {
    mesh.geometry = window.__xmasGeo;
    mesh.material = new THREE.MeshStandardMaterial({ map: texXmas, normalMap: texXmasN, roughnessMap: texXmasMAR, metalnessMap: texXmasMAR, side: THREE.DoubleSide, roughness: 1, metalness: 1, envMapIntensity: 1.2 });
  } else {
    mesh.geometry = window.__snowGeoBackup;
    mesh.material = window.__snowMatBackup;
  }
}

loader.load(ASSET + 'lion/secretfile.glb', setupProp, undefined, (e) => {
  document.getElementById('big2').textContent = 'prop load failed';
  console.error(e);
});


document.addEventListener('click', function () { try { parent.closeLionInspect(); } catch (e) {} });

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

const clock = new THREE.Clock();
let firstFrame = true;
function animate() {
  requestAnimationFrame(animate);
  let dt = Math.min(clock.getDelta(), 0.05);
  if (firstFrame) { dt = 0; firstFrame = false; }
  mixers.forEach((m) => m.update(dt));
  if (mixers.length && mixers[0]._actions && mixers[0]._actions.length) {
    var tEl = document.getElementById('big2');
    if (tEl) tEl.textContent = 'anim t=' + mixers[0]._actions[0].time.toFixed(2);
  }
  if (window.__head) {
    window.__head.getWorldPosition(tmp);
    const dist = 0;
    const h = 0.1;
    const fov = 80;
    camera.position.copy(tmp);
    camera.position.y += h;
    if (window.__socket) {
      window.__socket.getWorldPosition(camera.__target || (camera.__target = new THREE.Vector3()));
      const target = camera.__target;
      const dir = target.clone().sub(camera.position).normalize();
      camera.position.addScaledVector(dir, -dist);
      const look = target.clone();
      camera.lookAt(look);
    }
    if (camera.fov !== fov) { camera.fov = fov; camera.updateProjectionMatrix(); }
  }
  renderer.render(scene, camera);
}
animate();
</script>
</body>
</html>
