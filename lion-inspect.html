<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>金狮检视</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:transparent;overflow:hidden}
#app{position:fixed;inset:0}
#status{position:fixed;left:12px;bottom:10px;font:11px -apple-system,sans-serif;color:#64748b;z-index:5}
</style>
</head>
<body>
<div id="app"></div>
<div id="status">加载中…</div>
<script type="module">
const ASSET = './';
import * as THREE from './vendor/three/three.module.js';
import { GLTFLoader } from './vendor/three/addons/loaders/GLTFLoader.js';
import { RoomEnvironment } from './vendor/three/addons/environments/RoomEnvironment.js';
import * as BufferGeometryUtils from './vendor/three/addons/utils/BufferGeometryUtils.js';

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio || 1, 3));
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.getElementById('app').appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = null;
const camera = new THREE.PerspectiveCamera(80, innerWidth / innerHeight, 0.01, 100);

const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
scene.environmentIntensity = 0.7;
scene.add(new THREE.HemisphereLight(0xbfd4ff, 0x141a22, 1.6));
const key = new THREE.DirectionalLight(0xffffff, 2.4);
key.position.set(3, 5, 4);
scene.add(key);
const rim = new THREE.DirectionalLight(0x6ea8ff, 1.6);
rim.position.set(-3, 3, -3);
scene.add(rim);

function loadColor(url) {
  const t = new THREE.TextureLoader().load(url);
  t.flipY = false;
  t.colorSpace = THREE.SRGBColorSpace;
  t.anisotropy = renderer.capabilities.getMaxAnisotropy();
  t.minFilter = THREE.LinearMipmapLinearFilter;
  t.magFilter = THREE.LinearFilter;
  t.generateMipmaps = true;
  return t;
}
function loadData(url) {
  const t = new THREE.TextureLoader().load(url);
  t.flipY = false;
  t.anisotropy = renderer.capabilities.getMaxAnisotropy();
  t.minFilter = THREE.LinearMipmapLinearFilter;
  t.magFilter = THREE.LinearFilter;
  t.generateMipmaps = true;
  return t;
}

const texGlove = loadColor(ASSET + 'lion/gloves_D.png');
const texGloveN = loadData(ASSET + 'lion/gloves_N.png');
const texXmas = loadColor(ASSET + 'lion/xmas_D.png');
const texSnow = loadColor(ASSET + 'lion/snow_D.png');
const texSnowN = loadData(ASSET + 'lion/snow_N.png');
const texSnowMAR = loadData(ASSET + 'lion/snow_MAR.png');
const texXmasN = loadData(ASSET + 'lion/xmas_N.png');
const texXmasMAR = loadData(ASSET + 'lion/xmas_MAR.png');
const texKurt = loadColor(ASSET + 'lion/sniper_D.png');
const texKurtN = loadData(ASSET + 'lion/sniper_N.png');
const texKurtMAR = loadData(ASSET + 'lion/sniper_MAR.png');
const texTorso = loadColor(ASSET + 'lion/torso_D.png');
const texTorsoN = loadData(ASSET + 'lion/torso_N.png');
const texLeg = loadColor(ASSET + 'lion/leg_D.png');
const texLegN = loadData(ASSET + 'lion/leg_N.png');
const texShoe = loadColor(ASSET + 'lion/shoes_D.png');
const texHead = loadColor(ASSET + 'lion/head_D.png');
const texHeadN = loadData(ASSET + 'lion/head_N.png');
const texLion = loadColor(ASSET + 'lion/lion_D.png');

const useSnow = new URLSearchParams(location.search).get('gloves') === 'snow';
const PREVIEW = new URLSearchParams(location.search).get('preview') === '1';
if (PREVIEW) {
  const cv = document.createElement('canvas');
  cv.width = 4; cv.height = 256;
  const cx = cv.getContext('2d');
  const gr = cx.createLinearGradient(0, 0, 0, 256);
  gr.addColorStop(0, '#39424f');
  gr.addColorStop(0.55, '#222933');
  gr.addColorStop(1, '#0c0f13');
  cx.fillStyle = gr;
  cx.fillRect(0, 0, 4, 256);
  const bgTex = new THREE.CanvasTexture(cv);
  bgTex.colorSpace = THREE.SRGBColorSpace;
  scene.background = bgTex;
  const ground = new THREE.Mesh(
    new THREE.CircleGeometry(1.1, 64),
    new THREE.MeshStandardMaterial({ color: 0x161b22, roughness: 0.9, metalness: 0.08 })
  );
  ground.rotation.x = -Math.PI / 2;
  ground.position.y = -0.35;
  scene.add(ground);
  const grid = new THREE.GridHelper(2.2, 24, 0x2a3442, 0x1d242d);
  grid.position.y = -0.348;
  scene.add(grid);
  window.__previewGround = ground;
}
const loader = new GLTFLoader();
const tmp = new THREE.Vector3();
const qtmp = new THREE.Quaternion();
let mixers = [];
let actions = [];

function setupCharacter(gltf) {
  const model = gltf.scene;
  model.scale.setScalar(0.01);
  window.__rolfGloves = [];
  window.__xmasGloves = [];
  window.__charBones = {};
  model.traverse((o) => {
    if (o.isBone) window.__charBones[o.name] = o;
    if (!o.isMesh) return;
    o.frustumCulled = false;
    const nm = (o.name || '').toLowerCase();
    if (nm.includes('glove') && nm.includes('xmas')) {
      o.material = new THREE.MeshStandardMaterial({ map: texXmas, normalMap: texXmasN, normalScale: new THREE.Vector2(1.25, 1.25), roughnessMap: texXmasMAR, metalnessMap: texXmasMAR, side: THREE.DoubleSide, roughness: 1, metalness: 1, envMapIntensity: 1.2 });
      window.__xmasGloves.push(o);
    } else if (nm.includes('glove')) {
      o.material = new THREE.MeshStandardMaterial({ map: texGlove, normalMap: texGloveN, normalScale: new THREE.Vector2(1.25, 1.25), side: THREE.DoubleSide, roughness: 0.75, metalness: 0.05 });
      window.__rolfGloves.push(o);
    } else if (nm.includes('leg')) {
      o.material = new THREE.MeshStandardMaterial({ map: texLeg, normalMap: texLegN, normalScale: new THREE.Vector2(1.25, 1.25), side: THREE.DoubleSide, roughness: 0.8, metalness: 0.05 });
    } else if (nm.includes('shoe')) {
      o.material = new THREE.MeshStandardMaterial({ map: texShoe, side: THREE.DoubleSide, roughness: 0.8, metalness: 0.05 });
    } else if (nm.includes('head')) {
      o.material = new THREE.MeshStandardMaterial({ map: texHead, normalMap: texHeadN, normalScale: new THREE.Vector2(1.25, 1.25), side: THREE.DoubleSide, roughness: 0.75, metalness: 0.05 });
      o.visible = false;
    } else if (nm.includes('torso')) {
      o.material = new THREE.MeshStandardMaterial({ map: texTorso, normalMap: texTorsoN, normalScale: new THREE.Vector2(1.25, 1.25), side: THREE.DoubleSide, roughness: 0.8, metalness: 0.05 });
    }
  });
  scene.add(model);
  model.updateMatrixWorld(true);
  window.__model = model;
  window.__head = model.getObjectByName('head') || model.getObjectByName('neck_01');
  window.__socket = model.getObjectByName('item_r') || model.getObjectByName('item_l') || model.getObjectByName('hand_r');

  const fps = 30;
  if (!PREVIEW) gltf.animations.forEach((clip) => {
    const start = Math.floor(0.2 * fps);
    const end = Math.max(start + 1, Math.floor((clip.duration - 0.8) * fps));
    const trimmed = THREE.AnimationUtils.subclip(clip, clip.name, start, end, fps);
    const mixer = new THREE.AnimationMixer(model);
    const action = mixer.clipAction(trimmed);
    action.setLoop(THREE.LoopOnce, 1);
    action.clampWhenFinished = true;
    action.play();
    if (clip.name.indexOf('.002') < 0) {
      mixer.addEventListener('finished', function () {
        try { parent.closeLionInspect(); } catch (e) {}
      });
    }
    mixers.push(mixer);
    actions.push(action);
  });
  if (PREVIEW) {
    model.traverse(function (o) { if (o.isSkinnedMesh) o.pose(); });
  }
  document.getElementById('status').textContent = '';
  applyGloves();
}

function setupLion(gltf) {
  const lion = gltf.scene;
  lion.traverse((o) => {
    if (!o.isMesh) return;
    o.frustumCulled = false;
    try {
      const geo = BufferGeometryUtils.mergeVertices(o.geometry, 1e-4);
      geo.computeVertexNormals();
      o.geometry = geo;
    } catch (e) {}
    o.material = new THREE.MeshStandardMaterial({
      map: texLion,
      color: 0xffffff,
      side: THREE.DoubleSide,
      metalness: 0.85,
      roughness: 0.32,
      envMapIntensity: 0.65
    });
  });
  const attach = () => {
    if (window.__socket) {
      window.__socket.add(lion);
      if (PREVIEW) lion.visible = false;
      lion.scale.setScalar(100);
      lion.position.set(0, 0, 0);
      lion.rotation.set(1.5, 0, 0);
    } else {
      setTimeout(attach, 200);
    }
  };
  attach();
}

loader.load(ASSET + 'lion/character.glb', setupCharacter, undefined, (e) => {
  document.getElementById('status').textContent = '角色加载失败';
  console.error(e);
});
loader.load(ASSET + 'lion/lion.glb', setupLion, undefined, (e) => console.error(e));
loader.load(ASSET + 'lion/gloves_kurt_quit.glb', function (gltf) {
  gltf.scene.traverse(function (o) { if (o.isMesh && !window.__kurtGeo) window.__kurtGeo = o.geometry; });
  applyGloves();
}, undefined, function (e) { console.error(e); });
loader.load(ASSET + 'lion/gloves_snow_retarget.glb', function (gltf) {
  gltf.scene.traverse(function (o) {
    if (o.isMesh && !window.__snowGeo) window.__snowGeo = o.geometry;
  });
  applyGloves();
}, undefined, function (e) { console.error(e); });

const GLOVE_MAP164 = [0, 1, 2, 3, 4, 5, 6, 17, 18, 19, 20, 21, 22, 23, 24, 25, 37, 38, 39, 40, 63, 64, 65, 66, 67, 68, 69, 70, 71, 72, 73, 74, 81, 82, 83, 84, 85, 86, 87, 88, 89, 90, 91, 92, 93, 96, 97, 98, 103, 104, 105, 106, 107, 108, 109, 110, 111, 112, 113, 114, 120, 121, 122, 123, 124, 125, 126, 127, 128, 129, 130, 131, 134, 135, 136, 141, 142, 143, 144, 145, 146, 147, 148, 160, 161, 162, 163];
function remap164(geo) {
  const si = geo.attributes.skinIndex, sw = geo.attributes.skinWeight;
  if (!si || !sw) return geo;
  const n = si.count, out = new Uint16Array(n * 4);
  for (let v = 0; v < n; v++) {
    for (let k = 0; k < 4; k++) {
      const idx = si.getComponent(v, k);
      const w = sw.getComponent(v, k);
      const m = (w > 0 && idx < GLOVE_MAP164.length) ? GLOVE_MAP164[idx] : 0;
      out[v * 4 + k] = m >= 0 ? m : 0;
    }
  }
  const g = geo.clone();
  g.setAttribute('skinIndex', new THREE.Uint16BufferAttribute(out, 4));
  return g;
}

function applyGloves(kindOverride) {
  const kind = kindOverride || new URLSearchParams(location.search).get('gloves') || localStorage.getItem('ab_lion_gloves') || 'g05';
  const showXmas = kind === 'xmas';
  (window.__rolfGloves || []).forEach((m) => { m.visible = !showXmas; });
  (window.__xmasGloves || []).forEach((m) => { m.visible = showXmas; });
  const rolf = (window.__rolfGloves || [])[0];
  if (!rolf) return;
  if (/^g\d\d$/.test(kind)) {
    if (PREVIEW) {
      (window.__rolfGloves || []).forEach((m) => { m.visible = false; });
      (window.__xmasGloves || []).forEach((m) => { m.visible = false; });
    }
    const applyG = function (geo) {
      if (!geo) return;
      (window.__rolfGloves || []).forEach((m) => { m.visible = true; });
      (window.__xmasGloves || []).forEach((m) => { m.visible = false; });
      rolf.geometry = geo;
      rolf.geometry.computeBoundingSphere();
      const gm = new THREE.MeshStandardMaterial({ side: THREE.DoubleSide, roughness: 0.75, metalness: 0.05 });
      gm.map = loadColor(ASSET + 'lion/' + kind + '_D.png');
      gm.normalMap = loadData(ASSET + 'lion/' + kind + '_N.png');
      gm.normalScale = new THREE.Vector2(1.25, 1.25);
      gm.roughnessMap = loadData(ASSET + 'lion/' + kind + '_MAR.png');
      gm.metalnessMap = gm.roughnessMap;
      rolf.material = gm;
    };
    window.__gCache = window.__gCache || {};
    if (window.__gCache[kind]) { applyG(window.__gCache[kind]); return; }
    loader.load(ASSET + 'lion/' + kind + '.glb', function (gltf) {
      let geo = null;
      gltf.scene.traverse(function (o) { if (o.isMesh && !geo) geo = o.geometry; });
      if (!geo) return;
      geo = remap164(geo);
      window.__gCache[kind] = geo;
      applyG(geo);
    }, undefined, function (e) { console.error(e); });
    return;
  }
  if (!window.__rolfGeoBackup) window.__rolfGeoBackup = rolf.geometry;
  if (!window.__rolfMatBackup) window.__rolfMatBackup = rolf.material;
  if (kind === 'kurt' && window.__kurtGeo) {
    rolf.geometry = window.__kurtGeo;
    rolf.geometry.computeBoundingSphere();
    rolf.material = new THREE.MeshStandardMaterial({ map: texKurt, normalMap: texKurtN, normalScale: new THREE.Vector2(2.0, 2.0), roughnessMap: texKurtMAR, metalnessMap: texKurtMAR, side: THREE.DoubleSide, roughness: 0.78, metalness: 0.05, envMapIntensity: 0.6 });
  } else if (kind === 'snow' && window.__snowGeo) {
    rolf.geometry = window.__snowGeo;
    rolf.geometry.computeBoundingSphere();
    rolf.material = new THREE.MeshStandardMaterial({ map: texSnow, normalMap: texSnowN, normalScale: new THREE.Vector2(1.25, 1.25), roughnessMap: texSnowMAR, metalnessMap: texSnowMAR, side: THREE.DoubleSide, roughness: 0.7, metalness: 0.1, envMapIntensity: 0.5 });
  } else {
    if (window.__rolfGeoBackup) rolf.geometry = window.__rolfGeoBackup;
    if (window.__rolfMatBackup) rolf.material = window.__rolfMatBackup;
  }

}

var __lastReplay = 0;
function replay() {
  var now = Date.now();
  if (now - __lastReplay < 1200) return;
  __lastReplay = now;
  if (!actions.length) { setTimeout(replay, 120); return; }
  mixers.forEach(function (m) { try { m.time = 0; } catch (e) {} });
  actions.forEach((a) => {
    try { a.stop(); a.reset(); a.play(); } catch (e) {}
  });
  mixers.forEach(function (m) { try { m.update(0); } catch (e) {} });
}

window.addEventListener('message', (e) => {
  if (e.data === 'lion-replay') { replay(); return; }
  if (typeof e.data === 'string' && e.data.indexOf('gloves:') === 0) {
    applyGloves(e.data.slice(7));
  }
});

document.addEventListener('click', function () {
  try { parent.closeLionInspect(); } catch (e) {}
});

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

const clock = new THREE.Clock();
let firstFrame = true;
function animate() {
  requestAnimationFrame(animate);
  let dt = Math.min(clock.getDelta(), 0.05);
  if (firstFrame) { dt = 0; firstFrame = false; }
  if (!PREVIEW) mixers.forEach((m) => m.update(dt));
  if (PREVIEW) {
    if (window.__socket) {
      const t = camera.__pt || (camera.__pt = new THREE.Vector3());
      window.__socket.getWorldPosition(t);
      window.__ang = (window.__ang || 0) + dt * 0.8;
      camera.position.set(t.x + Math.sin(window.__ang) * 0.38, t.y + 0.12, t.z + Math.cos(window.__ang) * 0.38);
      camera.lookAt(t);
      if (camera.fov !== 50) { camera.fov = 50; camera.updateProjectionMatrix(); }
    }
    renderer.render(scene, camera);
    return;
  }
  if (window.__head) {
    window.__head.getWorldPosition(tmp);
    camera.position.copy(tmp);
    camera.position.y += 0.1;
    if (window.__socket) {
      window.__socket.getWorldPosition(camera.__target || (camera.__target = new THREE.Vector3()));
      const target = camera.__target;
      const dir = target.clone().sub(camera.position).normalize();
      const right = new THREE.Vector3().crossVectors(dir, new THREE.Vector3(0, 1, 0)).normalize();
      camera.position.addScaledVector(right, -0.05);
      const look = target.clone();
      look.y += 0.1 * 1.5;
      camera.lookAt(look);
    }
  }
  if (camera.fov !== 80) { camera.fov = 80; camera.updateProjectionMatrix(); }
  renderer.render(scene, camera);
}
animate();
</script>
</body>
</html>
